function worldFailed(err,stage){
  try{ console.error("Blockfall: world build failed while "+stage, err); }catch(e){}
  var msg=(err&&err.message)?String(err.message):String(err);
  paused=true;
  elMenu.hidden=false; elBarWrap.hidden=true;
  elRow.hidden=false; elWorldChips.hidden=false;
  elSub.textContent="This world wouldn't build \u2014 it failed while "+stage+
    " ("+msg.slice(0,80)+"). Pick one below, or press RESEED.";
  if(worldFails>=1) return;          // never loop on a fallback that also fails
  worldFails++;
  var keys=Object.keys(PRESET_WORLDS);
  if(!keys.length) return;
  W=sanitizeRecipe(PRESET_WORLDS[keys[0]]);
  seed=(Math.random()*1e9)|0;
  edits.clear(); lastBuild=null; selected=0; story=null;
  try{ beam.visible=false; }catch(e){}
  restoredPos=false;
  setTimeout(function(){
    rebuildWorld("That one wouldn't build, so here's solid ground instead.");
  },1200);
}
function rebuildWorld(subtitle){
  paused=true;
  elMenu.hidden=false; elRow.hidden=true; elBarWrap.hidden=false;
  elWorldChips.hidden=true;
  elTitle.textContent=W.name;
  elSub.textContent="Shaping "+W.name+"…";
  elNote.hidden=!W.note; elNote.textContent=W.note?("“"+W.note+"”"):"";
  elSeed.textContent="SEED "+seed+" · "+W.style.toUpperCase();
  var co2=document.getElementById("codeOut"); if(co2) co2.value=worldCode();
  elBar.style.width="0%";
  Object.keys(chunks).forEach(function(k){
    chunks[k].forEach(function(m){ chunkGroup.remove(m); m.geometry.dispose(); });
  });
  chunks={};
  colTop=new Int16Array(NCX*NCZ);
  drops.forEach(function(d){ dropGroup.remove(d.mesh); }); drops.length=0;
  cars.forEach(function(c){ carGroup.remove(c.mesh); }); cars.length=0; driving=null;
  for(var pk in peerMeshes) dropAvatar(pk);
  peerCount=0; netOutbox.length=0;
  held=null; invOpen=false; document.getElementById("inv").hidden=true;
  siteCols=null;
  parts.length=0;
  applyRecipeLook();
  buildHotbar();
  setTimeout(function(){
    try{
    generate(seed);
    applyEdits();
    relight(0,WX-1,0,WZ-1);
    computeTopY();
    computeColTops();
    var list=[], i, j, q;
    var mid=WX/2;
    for(i=0;i<NCX;i++) for(j=0;j<NCZ;j++) for(q=0;q<NCY;q++){
      if(q*CHY<=colTop[j*NCX+i]) list.push([i,q,j]);
    }
    list.sort(function(a,b){
      var da=Math.abs(a[0]*CH-mid)+Math.abs(a[2]*CH-mid);
      var db=Math.abs(b[0]*CH-mid)+Math.abs(b[2]*CH-mid);
      return da-db;
    });
    var k=0;
    (function next(){
      try{
      var budget=performance.now()+16;
      while(k<list.length && performance.now()<budget){ meshChunk(list[k][0],list[k][1],list[k][2]); k++; }
      elBar.style.width=(list.length?Math.round(k/list.length*100):100)+"%";
      if(k<list.length){ requestAnimationFrame(next); return; }
      {
        if(!restoredPos){
          spawn();
          // if this world has a city, start on its streets
          if(cities.length){
            var C0=cities[0], placed=false;
            for(var sr=0;sr<C0.radius-4&&!placed;sr+=2){
              for(var sa=0;sa<12&&!placed;sa++){
                var th=sa*0.5236;
                var sx=Math.round(C0.x+Math.cos(th)*sr), sz=Math.round(C0.z+Math.sin(th)*sr);
                if(sx<2||sz<2||sx>=WX-2||sz>=WZ-2) continue;
                if(getBlock(sx,C0.base,sz)!==ROAD) continue;
                if(getBlock(sx,C0.base+1,sz)!==AIR||getBlock(sx,C0.base+2,sz)!==AIR) continue;
                pos.x=sx+0.5; pos.y=C0.base+1.02; pos.z=sz+0.5;
                vel.x=vel.y=vel.z=0; flying=false; placed=true;
              }
            }
          }
        }
        restoredPos=false;
        spawnPoint={x:pos.x,y:pos.y,z:pos.z};
        // park a car on the road right next to you
        for(var ci=0;ci<40&&cars.length<1;ci++){
          var ang=ci*0.9, rad=3.2+ci*0.55;
          var cx2=Math.round(pos.x+Math.cos(ang)*rad), cz2=Math.round(pos.z+Math.sin(ang)*rad);
          if(cx2<4||cz2<4||cx2>WX-4||cz2>WZ-4) continue;
          var cg=groundUnder(cx2,cz2,pos.y+8);
          if(cg<-900||cg<=W.sea) continue;
          var onRoadCell=(getBlock(cx2,Math.round(cg)-1,cz2)===ROAD);
          if(cars.length===0&&ci<30&&!onRoadCell) continue;   // prefer the roadway
          spawnCar(cx2,cg+RIDE,cz2,ang+Math.PI/2);
        }
        hp=maxHp; breath=maxBreath; dead=false;
        unstick();
        physQ=[]; physSeen={};
        mapDirty=true; drawMap();
        spawnCritters();
        saveNow();
        elBarWrap.hidden=true; elRow.hidden=false; elWorldChips.hidden=false;
        elSub.textContent=subtitle||"Mine it, build on it, or dream up somewhere else.";
        fillKeys();
        if(!creative && !invHinted){
          invHinted=true;
          setTimeout(function(){
            toast(isTouch?"Break blocks to collect them. PACK opens your inventory."
                         :"Break blocks to collect them. E opens your inventory.");
          },1400);
        }
        worldFails=0;
      }
      }catch(e){ worldFailed(e,"building the view"); }
    })();
    }catch(e){ worldFailed(e,"shaping the land"); }
  },30);
}
function usePreset(key){
  if(!PRESET_WORLDS[key]) return;
  W=sanitizeRecipe(PRESET_WORLDS[key]);
  seed=(Math.random()*1e9)|0; edits.clear(); lastBuild=null; selected=0; story=null; beam.visible=false;
  rebuildWorld("A world that ships with the game.");
}
(function(){
  Object.keys(PRESET_WORLDS).forEach(function(k){
    var b=document.createElement("button");
    b.type="button"; b.className="chip"; b.textContent=PRESET_WORLDS[k].name;
    b.addEventListener("click",function(){ usePreset(k); });
    elWorldChips.appendChild(b);
  });
})();
function boot(state){
  initBloom();
  netInit();
  fillKeys(); resize(); buildSettings();
  var saved=(state&&state.saved)||loadSaved();
  var sub="Walk out, dig in. Everything you change stays put.";
  if(saved){
    seed=saved.seed;
    if(saved.recipe) W=sanitizeRecipe(saved.recipe);
    if(saved.edits) for(var i=0;i<saved.edits.length;i+=2) edits.set(saved.edits[i],saved.edits[i+1]);
    if(saved.pos){ pos.x=saved.pos.x; pos.y=saved.pos.y; pos.z=saved.pos.z; restoredPos=true; }
    if(typeof saved.yaw==="number") yaw=saved.yaw;
    if(typeof saved.pitch==="number") pitch=saved.pitch;
    if(typeof saved.sel==="number") selected=clamp(saved.sel,0,HOTBAR_N-1);
    if(saved.inv&&saved.inv.length===SLOTS) inv=saved.inv;
    if(typeof saved.creative==="boolean") creative=saved.creative;
    if(saved.story && saved.story.beats && saved.story.beats.length) story=saved.story;
    if(saved.opt){
      audioOn=saved.opt.a!==false; mapOn=saved.opt.m!==false; crittersOn=saved.opt.c!==false;
      speedIdx=clamp(saved.opt.t|0,0,SPEEDS.length-1); todSpeed=SPEEDS[speedIdx];
      if(typeof saved.opt.tod==="number") tod=clamp(saved.opt.tod,0,0.999);
      if(typeof saved.opt.b==="boolean") bloomOn=saved.opt.b;
      if(typeof saved.opt.sh==="boolean") shadowsOn=saved.opt.sh;
      if(typeof saved.opt.v==="number") viewDist=clamp(saved.opt.v,90,190);
    }
    sub="Back in "+W.name+", with "+edits.size+" block"+(edits.size===1?"":"s")+" you changed.";
  }
  rebuildWorld(sub);
  requestAnimationFrame(frame);
}
if(window.claude && window.claude.hot && window.claude.hot.snapshot){
  window.claude.hot.snapshot(function(){
    var arr=[]; edits.forEach(function(v,k){arr.push(k,v);});
    return {saved:{seed:seed,recipe:W,edits:arr,pos:pos,yaw:yaw,pitch:pitch,sel:selected,inv:inv,creative:creative,story:story,opt:{a:audioOn,m:mapOn,c:crittersOn,t:speedIdx,tod:tod,b:bloomOn,v:viewDist,sh:shadowsOn}}};
  });
}
if(window.claude && window.claude.hot && window.claude.hot.ready){ window.claude.hot.ready(boot); }
else{ boot(window.claude && window.claude.hot ? window.claude.hot.data : null); }
window.addEventListener("beforeunload",saveNow);
})();
</script>
