function carForward(c){ return {x:Math.sin(c.yaw), z:Math.cos(c.yaw)}; }
function carRight(c){ return {x:Math.cos(c.yaw), z:-Math.sin(c.yaw)}; }

// a box sweep so the car cannot drive through walls
function carBlocked(c,nx,nz){
  var f={x:Math.sin(c.yaw),z:Math.cos(c.yaw)};
  var r={x:Math.cos(c.yaw),z:-Math.sin(c.yaw)};
  for(var a=-1;a<=1;a++) for(var b=-1;b<=1;b++){
    var px=nx+f.x*(CAR_L*0.82*a)+r.x*(CAR_W*0.85*b);
    var pz=nz+f.z*(CAR_L*0.82*a)+r.z*(CAR_W*0.85*b);
    // anything standing more than a wheel's height above the hub blocks us
    for(var dy=0;dy<2;dy++){
      var yy=Math.floor(c.y+0.25+dy*0.6);
      var t=getBlock(Math.floor(px),yy,Math.floor(pz));
      if(t===AIR||LIQUID[t]||WALKTHROUGH[t]) continue;
      var box=shapeOf(t);
      if(yy+box[4] > c.y+0.30) return true;
    }
  }
  return false;
}

function stepCars(dt,now){
  for(var i=0;i<cars.length;i++){
    var c=cars[i];
    var isMe=(driving===c);

    if(isMe && !dead){
      var thr=0, brk=0, st=0;
      if(keys.KeyW||touchJump) thr+=1;
      if(keys.KeyS) thr-=1;
      if(keys.Space) brk=1;
      if(keys.KeyA) st-=1;
      if(keys.KeyD) st+=1;
      if(stickId!==null){ thr-=stickVec.y; st+=stickVec.x; }
      c.throttle=clamp(thr,-1,1); c.brake=brk;
      // steering eases in, and tightens less the faster you go
      var speedNow=Math.sqrt(c.vx*c.vx+c.vz*c.vz);
      var authority=STEER_MAX*(1-clamp(speedNow/34,0,1)*0.55);
      c.steer+=clamp(st*authority-c.steer,-STEER_RATE*dt,STEER_RATE*dt);
    }else{
      c.throttle=0; c.brake=0;
      c.steer+=clamp(0-c.steer,-STEER_RATE*dt,STEER_RATE*dt);
    }

    // suspension: sample under each wheel
    var f=carForward(c), r=carRight(c);
    var hits=[], nGround=0, avg=0, frontY=0, rearY=0, leftY=0, rightY=0;
    for(var k=0;k<4;k++){
      var wx=c.x+r.x*WHEEL_POS[k][0]+f.x*WHEEL_POS[k][1];
      var wz=c.z+r.z*WHEEL_POS[k][0]+f.z*WHEEL_POS[k][1];
      var gy=groundUnder(wx,wz,c.y+0.9);
      hits.push(gy);
      if(gy>-900){ nGround++; avg+=gy; }
      if(k<2) frontY+=gy; else rearY+=gy;
      if(k%2===0) leftY+=gy; else rightY+=gy;
    }
    c.grounded=nGround;
    var onRoad=nGround>=2;

    if(onRoad){
      avg/=nGround;
      var targetY=avg+RIDE;
      // spring toward ride height rather than snapping, so bumps are absorbed
      var dy=targetY-c.y;
      c.vy+=dy*62*dt;
      c.vy*=Math.max(0,1-9.0*dt);
      if(Math.abs(dy)<0.02&&Math.abs(c.vy)<0.1){ c.y=targetY; c.vy=0; }
      c.slope=((frontY-rearY)*0.5)/(CAR_L*1.26);   // rise over run, front axle to rear
      c.pitch+=((rearY-frontY)*0.5*0.22-c.pitch)*Math.min(1,dt*7);
      c.roll +=((rightY-leftY)*0.5*0.26-c.roll )*Math.min(1,dt*7);
    }else{
      c.vy-=GRAV*dt;
      c.slope=0;
      c.pitch+=(-0.12-c.pitch)*Math.min(1,dt*2.5);
      c.roll*=Math.max(0,1-dt*2.0);
    }
    c.y+=c.vy*dt;

    // longitudinal and lateral, sharing one friction budget
    var fwdSpeed=c.vx*f.x+c.vz*f.z;
    var latSpeed=c.vx*r.x+c.vz*r.z;
    c.slip=0;
    if(onRoad){
      var under=getBlock(Math.floor(c.x),Math.floor(c.y-0.5),Math.floor(c.z));
      var maxG=gripOf(under)*(nGround>=4?1:0.72);
      var longUse=0;
      if(c.brake&&Math.abs(fwdSpeed)>0.05){
        var bd=Math.min(maxG*BRAKE_BIAS,Math.abs(fwdSpeed)/dt);
        fwdSpeed-=Math.sign(fwdSpeed)*bd*dt;
        longUse=bd;
      }else if(c.throttle>0){
        var drive=Math.min(ENGINE*c.throttle,maxG);   // wheels cannot push harder than they grip
        fwdSpeed+=drive*dt;
        longUse=drive;
      }else if(c.throttle<0&&fwdSpeed>-8){
        var rv=Math.min(REVERSE*-c.throttle,maxG);
        fwdSpeed-=rv*dt;
        longUse=rv;
      }
      fwdSpeed-=Math.sign(fwdSpeed)*Math.min(Math.abs(fwdSpeed),ROLL_RES*dt);
      // climbing costs you, descending gives it back
      var sl=clamp(c.slope||0,-1.2,1.2);
      fwdSpeed-=GRAV*(sl/Math.sqrt(1+sl*sl))*dt;
      // whatever grip the brakes and engine left over is available to corner with
      var frac=clamp(longUse/Math.max(maxG,0.001),0,1);
      var latAvail=maxG*Math.sqrt(Math.max(0,1-frac*frac));
      if(Math.abs(fwdSpeed)>0.3&&Math.abs(c.steer)>0.001){
        var tan=Math.abs(Math.tan(c.steer));
        var R=WHEELBASE/Math.max(tan,1e-4);
        var need=fwdSpeed*fwdSpeed/R;
        if(need>latAvail){
          R=fwdSpeed*fwdSpeed/Math.max(latAvail,0.05);   // understeer: the arc opens out
          c.slip=clamp((need/Math.max(latAvail,0.05))-1,0,3);
        }
        c.yaw+=Math.sign(c.steer)*Math.sign(fwdSpeed)*(Math.abs(fwdSpeed)/R)*dt;
      }
      latSpeed-=Math.sign(latSpeed)*Math.min(Math.abs(latSpeed),latAvail*dt);
    }
    fwdSpeed-=fwdSpeed*Math.abs(fwdSpeed)*CAR_DRAG*dt;
    f=carForward(c); r=carRight(c);
    c.vx=f.x*fwdSpeed+r.x*latSpeed;
    c.vz=f.z*fwdSpeed+r.z*latSpeed;

    // move, stopping against anything too tall to climb
    var nx=c.x+c.vx*dt, nz=c.z+c.vz*dt;
    if(carBlocked(c,nx,c.z)){
      if(isMe&&Math.abs(fwdSpeed)>9) damage(Math.abs(fwdSpeed)*1.2,"the crash");
      c.vx*=-0.18; nx=c.x;
      if(isMe&&Math.abs(fwdSpeed)>4) noiseHit(180,1.1,0.26,0.13,"lowpass");
    }
    if(carBlocked(c,nx,nz)){
      if(isMe&&Math.abs(fwdSpeed)>9) damage(Math.abs(fwdSpeed)*1.2,"the crash");
      c.vz*=-0.18; nz=c.z;
      if(isMe&&Math.abs(fwdSpeed)>4) noiseHit(180,1.1,0.26,0.13,"lowpass");
    }
    c.x=clamp(nx,2,WX-2); c.z=clamp(nz,2,WZ-2);
    if(c.y<-8){ c.y=40; c.vy=0; }

    // deep liquid drowns the engine
    var hubBlock=getBlock(Math.floor(c.x),Math.floor(c.y),Math.floor(c.z));
    if(LIQUID[hubBlock]){
      c.vx*=Math.max(0,1-2.6*dt); c.vz*=Math.max(0,1-2.6*dt);
      if(hubBlock===LAVA&&isMe) damage(9*dt,"the lava");
    }

    // pose the mesh
    c.wheelSpin+=fwdSpeed*dt/WHEEL_R;
    var m=c.mesh;
    m.position.set(c.x,c.y-RIDE+0.02,c.z);
    m.rotation.set(0,c.yaw,0,"YXZ");
    m.rotateX(clamp(c.pitch,-0.5,0.5));
    m.rotateZ(clamp(-c.roll,-0.5,0.5));
    var wheels=m.userData.wheels;
    for(k=0;k<4;k++){
      var wp=WHEEL_POS[k], wmesh=wheels[k];
      // the hub rides with its own patch of ground, within suspension travel
      var travel=(hits[k]>-900)?clamp(hits[k]-(c.y-RIDE),-0.28,0.28):-0.28;
      wmesh.grp.position.set(wp[0],WHEEL_R+travel,wp[1]);
      wmesh.grp.rotation.y=(k<2)?c.steer:0;
      wmesh.spin.rotation.x=c.wheelSpin;
    }
    // headlights come on in the dark
    var night=(nightAmt>0.35)||getSky(Math.floor(c.x),Math.floor(c.y+1),Math.floor(c.z))<6;
    m.userData.lamps.color.setHex(night?0xfff6d8:0xb9b093);
  }
}

// ---- getting in and out
function nearestCar(maxD){
  maxD=maxD||7;
  var best=null, bd=maxD*maxD;
  for(var i=0;i<cars.length;i++){
    var c=cars[i];
    var dx=c.x-pos.x, dy=c.y-pos.y, dz=c.z-pos.z;
    var d=dx*dx+dy*dy*0.4+dz*dz;
    if(d<bd){ bd=d; best=c; }
  }
  return best;
}
function enterCar(c){
  driving=c;
  vel.x=vel.y=vel.z=0;
  flying=false;
  toast("Driving. W/S throttle, A/D steer, Space brake, F to get out.");
  tone(90,0.5,0.05,"sawtooth",150);
}
function exitCar(){
  if(!driving) return;
  var c=driving;
  var r=carRight(c);
  // step out beside the car, onto whatever ground is there
  var ox=c.x+r.x*2.0, oz=c.z+r.z*2.0;
  var gy=groundUnder(ox,oz,c.y+2);
  if(gy<-900){ ox=c.x-r.x*2.0; oz=c.z-r.z*2.0; gy=groundUnder(ox,oz,c.y+2); }
  if(gy<-900){ ox=c.x; oz=c.z; gy=c.y; }
  pos.x=ox; pos.z=oz; pos.y=gy+0.05;
  vel.x=vel.y=vel.z=0;
  driving=null;
  unstick();
  toast("Out of the car.");
}
function toggleCar(){
  if(driving){ exitCar(); return; }
  var c=nearestCar(7);
  if(c) enterCar(c);
  else toast("No car within reach. Press V to call one.");
}
function callCar(){
  // put a car on open ground just ahead of where you are looking
  var f={x:-Math.sin(yaw), z:-Math.cos(yaw)};
  for(var d=6;d<=16;d+=2){
    var x=pos.x+f.x*d, z=pos.z+f.z*d;
    if(x<4||z<4||x>WX-4||z>WZ-4) break;
    var gy=groundUnder(x,z,pos.y+6);
    if(gy>-900 && gy>W.sea){
      if(cars.length>=4){
        var old=cars.shift();
        if(driving===old) driving=null;
        carGroup.remove(old.mesh);
      }
      var c=spawnCar(x,gy+RIDE,z,yaw+Math.PI);
      toast("A car rolled up. Walk over and press F.");
      tone(520,0.12,0.04,"square",760);
      return;
    }
  }
  toast("No clear ground ahead to put a car on.");
}

// ---- engine note: two detuned saws whose pitch tracks road speed
var engOsc=null, engOsc2=null, engGain=null, engFilt=null;
function startEngineAudio(){
  if(!AC||engOsc) return;
  engOsc=AC.createOscillator(); engOsc.type="sawtooth";
  engOsc2=AC.createOscillator(); engOsc2.type="square";
  engFilt=AC.createBiquadFilter(); engFilt.type="lowpass"; engFilt.frequency.value=760;
  engGain=AC.createGain(); engGain.gain.value=0;
  engOsc.connect(engFilt); engOsc2.connect(engFilt);
  engFilt.connect(engGain); engGain.connect(master);
  engOsc.start(); engOsc2.start();
}
function engineAudio(){
  if(!AC||!audioOn){ if(engGain) engGain.gain.value=0; return; }
  startEngineAudio();
  if(!engGain) return;
  if(!driving){ engGain.gain.value=Math.max(0,engGain.gain.value-0.04); return; }
  var sp=Math.sqrt(driving.vx*driving.vx+driving.vz*driving.vz);
  var rpm=42+sp*7.2+Math.abs(driving.throttle)*22;
  engOsc.frequency.value=rpm;
  engOsc2.frequency.value=rpm*0.502;
  engFilt.frequency.value=420+sp*52+Math.abs(driving.throttle)*300;
  var want=0.035+Math.abs(driving.throttle)*0.045+clamp(sp/CAR_TOP,0,1)*0.03;
  engGain.gain.value+=(want-engGain.gain.value)*0.12;
}

// ---- chase camera
function driveCamera(dt){
  var c=driving;
  var f=carForward(c);
  var sp=Math.sqrt(c.vx*c.vx+c.vz*c.vz);
  var back=6.4+clamp(sp*0.10,0,2.2);
  var want={
    x:c.x-f.x*back*Math.cos(pitch*0.3),
    y:c.y+2.5-pitch*3.2,
    z:c.z-f.z*back*Math.cos(pitch*0.3)
  };
  // swing around the car with the look controls
  var swing=yaw-c.yaw;
  want.x=c.x-Math.sin(c.yaw+swing)*back;
  want.z=c.z-Math.cos(c.yaw+swing)*back;
  // keep the camera out of the scenery
  var g=groundUnder(want.x,want.z,want.y+3);
  if(g>-900&&want.y<g+1.1) want.y=g+1.1;
  camera.position.x+=(want.x-camera.position.x)*Math.min(1,dt*8);
  camera.position.y+=(want.y-camera.position.y)*Math.min(1,dt*6);
  camera.position.z+=(want.z-camera.position.z)*Math.min(1,dt*8);
  var look=new THREE.Vector3(c.x,c.y+0.9,c.z);
  camera.lookAt(look);
  var targetFov=72+clamp(sp/CAR_TOP,0,1)*16;
  fovNow+=(targetFov-fovNow)*Math.min(1,dt*4);
  camera.fov=fovNow; camera.updateProjectionMatrix();
}

// ---- breaking takes time, and harder rock takes longer
function mineStep(dt){
  if(dead||driving||!mineHeld){
    mineTarget=null; mineProg=0; crackMesh.visible=false;
    return;
  }
  var h=pick(6);
  if(!h||h.y<=0){ mineTarget=null; mineProg=0; crackMesh.visible=false; return; }
  if(!mineTarget||mineTarget.x!==h.x||mineTarget.y!==h.y||mineTarget.z!==h.z){
    mineTarget={x:h.x,y:h.y,z:h.z}; mineProg=0; mineChip=0;
  }
  var t=getBlock(h.x,h.y,h.z);
  var hard=hardnessOf(t);
  mineProg+=dt;
  mineChip+=dt;
  if(mineChip>0.22){
    mineChip=0;
    noiseHit(380,2.0,0.07,0.05);
    burst(h.x,h.y,h.z,t,1,1.1);
  }
  var f=clamp(mineProg/hard,0,1);
  crackMesh.visible=true;
  crackMesh.position.set(h.x+0.5,h.y+0.5,h.z+0.5);
  crackTex.offset.x=Math.min(5,Math.floor(f*6))/6;
  if(mineProg>=hard){
    editBlock(h.x,h.y,h.z,AIR);
    spawnDrop(h.x,h.y,h.z,dropOf(t),1);
    burst(h.x,h.y,h.z,t,9,3.6);
    sfxBreak(t);
    onMined(t,h.x,h.y,h.z);
    mineTarget=null; mineProg=0; crackMesh.visible=false;
  }
}

// ================================================================ inventory and item drops
var HOTBAR_N=9, PACK_N=27, SLOTS=HOTBAR_N+PACK_N, STACK=64;
var inv=[];
(function(){ for(var i=0;i<SLOTS;i++) inv.push(null); })();
var creative=false, held=null, invOpen=false, invHinted=false;

// what a block gives you when you break it
var DROPS={};
DROPS[STONE]=COBBLE; DROPS[GRASS]=DIRT; DROPS[MOSS]=DIRT;
DROPS[LEAVES]=0; DROPS[GLASS]=0; DROPS[ICE]=0;
function dropOf(t){ return (DROPS[t]!==undefined)?DROPS[t]:t; }

function invCount(id){
  var n=0;
  for(var i=0;i<SLOTS;i++) if(inv[i]&&inv[i].id===id) n+=inv[i].count;
  return n;
}
function addItem(id,count){
  if(!id||count<=0) return 0;
  var left=count, i;
  for(i=0;i<SLOTS&&left>0;i++){
    if(inv[i]&&inv[i].id===id&&inv[i].count<STACK){
      var room=STACK-inv[i].count, take=Math.min(room,left);
      inv[i].count+=take; left-=take;
    }
  }
  for(i=0;i<SLOTS&&left>0;i++){
    if(!inv[i]){
      var put=Math.min(STACK,left);
      inv[i]={id:id,count:put}; left-=put;
    }
  }
  if(left<count){ refreshHotbar(); if(invOpen) drawInv(); }
  return count-left;
}
function takeFromSlot(i,n){
  if(!inv[i]) return 0;
  var take=Math.min(n,inv[i].count);
  inv[i].count-=take;
  if(inv[i].count<=0) inv[i]=null;
  refreshHotbar(); if(invOpen) drawInv();
  return take;
}
function heldBlock(){
  if(creative) return W.palette[selected%W.palette.length];
  return inv[selected]?inv[selected].id:0;
}

// ---- dropped items you walk over to collect
var drops=[], itemGeoCache={}, dropGroup=new THREE.Group();
scene.add(dropGroup);
var itemMat=new THREE.MeshBasicMaterial({map:atlasTex});
function itemGeo(id){
  if(itemGeoCache[id]) return itemGeoCache[id];
  var g=new THREE.BoxGeometry(0.3,0.3,0.3);
  var tiles=TILES[id]||TILES[3];
  var uv=g.attributes.uv;
  // box face order: +x -x +y -y +z -z
  var faceTile=[tiles[1],tiles[1],tiles[0],tiles[2],tiles[1],tiles[1]];
  for(var f=0;f<6;f++){
    var tile=faceTile[f], tx=tile%ACOLS, ty=(tile/ACOLS)|0;
    for(var v=0;v<4;v++){
      var k=f*4+v;
      var u0=uv.getX(k), v0=uv.getY(k);
      uv.setXY(k,(tx+0.02+u0*0.96)/ACOLS,(AROWS-1-ty+0.02+v0*0.96)/AROWS);
    }
  }
  uv.needsUpdate=true;
  itemGeoCache[id]=g;
  return g;
}
function spawnDrop(x,y,z,id,count){
  if(!id||creative) return;
  if(drops.length>110){
    var old=drops.shift();
    dropGroup.remove(old.mesh);
  }
  var m=new THREE.Mesh(itemGeo(id),itemMat);
  m.position.set(x+0.5,y+0.4,z+0.5);
  dropGroup.add(m);
  drops.push({x:x+0.5,y:y+0.4,z:z+0.5,vy:1.6,
    vx:(Math.random()-0.5)*1.2,vz:(Math.random()-0.5)*1.2,
    id:id,count:count||1,mesh:m,age:0,spin:Math.random()*6.28});
}
function stepDrops(dt,now){
  var i=0;
  while(i<drops.length){
    var d=drops[i];
    d.age+=dt;
    d.vy-=GRAV*dt;
    var nx=d.x+d.vx*dt, nz=d.z+d.vz*dt;
    if(!isSolid(Math.floor(nx),Math.floor(d.y),Math.floor(nz))){ d.x=nx; d.z=nz; }
    else { d.vx*=-0.4; d.vz*=-0.4; }
    d.y+=d.vy*dt;
    if(isSolid(Math.floor(d.x),Math.floor(d.y-0.15),Math.floor(d.z))){
      d.y=Math.floor(d.y-0.15)+1.15; d.vy=0; d.vx*=0.78; d.vz*=0.78;
    }
    if(d.y<-5){ dropGroup.remove(d.mesh); drops.splice(i,1); continue; }
    // drift toward the player, then get picked up
    var dx=pos.x-d.x, dy=(pos.y+0.8)-d.y, dz=pos.z-d.z;
    var dist=Math.sqrt(dx*dx+dy*dy+dz*dz);
    if(d.age>0.4&&dist<2.4&&!dead){
      var pull=5.5*dt/Math.max(dist,0.4);
      d.x+=dx*pull; d.y+=dy*pull; d.z+=dz*pull;
      if(dist<0.75){
        var got=addItem(d.id,d.count);
        if(got>0){
          d.count-=got;
          tone(660+Math.random()*120,0.07,0.03,"sine",940);
          if(d.count<=0){ dropGroup.remove(d.mesh); drops.splice(i,1); continue; }
        }
      }
    }
    d.mesh.position.set(d.x,d.y+Math.sin(now*0.003+d.spin)*0.06,d.z);
    d.mesh.rotation.y=now*0.0016+d.spin;
    i++;
  }
}

// ---- hotbar and the full grid
function slotIcon(id,size){
  var c=document.createElement("canvas");
  c.width=c.height=TPX;
  var g=c.getContext("2d");
  g.imageSmoothingEnabled=false;
  var tile=(TILES[id]||TILES[3])[1];
  g.drawImage(atlasCanvas,(tile%ACOLS)*TPX,((tile/ACOLS)|0)*TPX,TPX,TPX,0,0,TPX,TPX);
  return c;
}
function refreshHotbar(){
  if(!elHot) return;
  elHot.innerHTML="";
  for(var i=0;i<HOTBAR_N;i++){
    var id=creative?W.palette[i]:(inv[i]?inv[i].id:0);
    var cnt=creative?0:(inv[i]?inv[i].count:0);
    var b=document.createElement("button");
    b.className="slot"+(i===selected?" sel":"")+(id?"":" empty");
    b.type="button";
    b.title=id?NAMES[id]:"empty";
    b.setAttribute("aria-label",id?NAMES[id]:"empty slot");
    if(id) b.appendChild(slotIcon(id));
    if(cnt>1){
      var n=document.createElement("b"); n.className="cnt"; n.textContent=cnt; b.appendChild(n);
    }
    var k=document.createElement("i"); k.textContent=i+1; b.appendChild(k);
    (function(idx){ b.addEventListener("click",function(e){ e.preventDefault(); setSel(idx); }); })(i);
    elHot.appendChild(b);
  }
}
function drawInv(){
  var pack=document.getElementById("invPack"), bar=document.getElementById("invBar");
  var pal=document.getElementById("invPal"), palWrap=document.getElementById("invPalWrap");
  if(!pack) return;
  function cell(i){
    var it=inv[i];
    var b=document.createElement("button");
    b.className="islot"+(it?"":" empty")+(i===selected?" sel":"");
    b.type="button";
    if(it){
      b.appendChild(slotIcon(it.id));
      if(it.count>1){ var n=document.createElement("b"); n.className="cnt"; n.textContent=it.count; b.appendChild(n); }
      b.title=NAMES[it.id]+" ×"+it.count;
    }
    b.addEventListener("click",function(){ clickSlot(i); });
    return b;
  }
  pack.innerHTML=""; bar.innerHTML="";
  for(var i=HOTBAR_N;i<SLOTS;i++) pack.appendChild(cell(i));
  for(i=0;i<HOTBAR_N;i++) bar.appendChild(cell(i));
  palWrap.hidden=!creative;
  if(creative){
    pal.innerHTML="";
    var all=[GRASS,DIRT,STONE,COBBLE,SAND,CLAY,BASALT,ASH,SNOW,ICE,LOG,PLANK,LEAVES,MOSS,GLASS,LAMP,CRYSTAL,
               SLAB,SLAB_W,POST,LAYER];
    all.forEach(function(id){
      var b=document.createElement("button");
      b.className="islot"; b.type="button"; b.title=NAMES[id];
      b.appendChild(slotIcon(id));
      b.addEventListener("click",function(){
        W.palette[selected%W.palette.length]=id;
        refreshHotbar(); drawInv(); saveSoon();
      });
      pal.appendChild(b);
    });
  }
  var hb=document.getElementById("invHeld");
  if(held){
    hb.hidden=false; hb.innerHTML="";
    hb.appendChild(slotIcon(held.id));
    var t=document.createElement("span");
    t.textContent=NAMES[held.id]+" ×"+held.count+" — tap a slot to put it down";
    hb.appendChild(t);
  }else hb.hidden=true;
}
function clickSlot(i){
  if(creative){ if(i<HOTBAR_N) setSel(i); return; }
  if(held){
    var cur=inv[i];
    if(!cur) inv[i]={id:held.id,count:held.count}, held=null;
    else if(cur.id===held.id){
      var room=STACK-cur.count, take=Math.min(room,held.count);
      cur.count+=take; held.count-=take;
      if(held.count<=0) held=null;
    }else{ inv[i]=held; held=cur; }
  }else if(inv[i]){
    held=inv[i]; inv[i]=null;
  }
  refreshHotbar(); drawInv(); saveSoon();
}
function openInv(){
  if(paused||asking||reading||invOpen) return;
  invOpen=true;
  document.getElementById("inv").hidden=false;
  document.getElementById("invMode").textContent=creative?"CREATIVE":"GATHERED";
  drawInv();
  if(document.pointerLockElement) document.exitPointerLock();
}
function closeInv(){
  if(held){ if(addItem(held.id,held.count)===0) dropHeldIntoWorld(held); held=null; }
  invOpen=false;
  document.getElementById("inv").hidden=true;
  refreshHotbar();

function spawn(){
  var best=null, step, a, ci;
  for(step=0;step<72 && !best;step++){
    for(a=0;a<=step && !best;a++){
      var cand=[[WX/2+a,WZ/2+step],[WX/2-a,WZ/2+step],[WX/2+step,WZ/2+a],
                [WX/2-step,WZ/2-a],[WX/2+a,WZ/2-step],[WX/2-a,WZ/2-step]];
      for(ci=0;ci<cand.length && !best;ci++){
        var x=clamp(cand[ci][0]|0,2,WX-3), z=clamp(cand[ci][1]|0,2,WZ-3);
        var top=surfaceTop(x,z);
        if(top>W.sea && top<WY-4 && getBlock(x,top+1,z)===AIR) best=[x,top+1,z];
      }
    }
  }
  if(!best){
    var bd=1e9;
    for(var sx=2;sx<WX-2;sx+=2) for(var sz=2;sz<WZ-2;sz+=2){
      var st=surfaceTop(sx,sz);
      if(st<=W.sea||st>=WY-4||getBlock(sx,st+1,sz)!==AIR) continue;
      var ddx=sx-WX/2, ddz=sz-WZ/2, dd=ddx*ddx+ddz*ddz;
      if(dd<bd){ bd=dd; best=[sx,st+1,sz]; }
    }
  }
  if(best){ pos.x=best[0]+0.5; pos.y=best[1]+0.05; pos.z=best[2]+0.5; flying=false; }
  else{ pos.x=WX/2; pos.y=Math.floor(WY*0.6); pos.z=WZ/2; flying=true; }
  vel.x=vel.y=vel.z=0;
}
var lastHitTop=-1, blockedH=false;
function resolve(axis,d){
  if(d===0) return;
  pos[axis]+=d;
  var minX=Math.floor(pos.x-PW/2), maxX=Math.floor(pos.x+PW/2);
  var minY=Math.floor(pos.y-0.05), maxY=Math.floor(pos.y+PH);
  var minZ=Math.floor(pos.z-PW/2), maxZ=Math.floor(pos.z+PW/2);
  for(var x=minX;x<=maxX;x++) for(var y=minY;y<=maxY;y++) for(var z=minZ;z<=maxZ;z++){
    var b=hitBox(x,y,z);
    if(!b) continue;
    var bx0=x+b[0], by0=y+b[1], bz0=z+b[2], bx1=x+b[3], by1=y+b[4], bz1=z+b[5];
    if(pos.x+PW/2<=bx0||pos.x-PW/2>=bx1) continue;
    if(pos.y+PH<=by0||pos.y>=by1) continue;
    if(pos.z+PW/2<=bz0||pos.z-PW/2>=bz1) continue;
    if(axis==="y"){
      if(d>0){ pos.y=by0-PH-0.0001; }
      else{ pos.y=by1+0.0001; onGround=true; }
      vel.y=0;
    }else if(axis==="x"){
      pos.x=(d>0)?(bx0-PW/2-0.0001):(bx1+PW/2+0.0001);
      vel.x=0; blockedH=true; if(by1>lastHitTop) lastHitTop=by1;
    }else{
      pos.z=(d>0)?(bz0-PW/2-0.0001):(bz1+PW/2+0.0001);
      vel.z=0; blockedH=true; if(by1>lastHitTop) lastHitTop=by1;
    }
    return;
  }
}
var _e=new THREE.Euler(0,0,0,"YXZ"), _v=new THREE.Vector3();
function pick(reach){
  _e.set(pitch,yaw,0,"YXZ");
  var dir=_v.set(0,0,-1).applyEuler(_e);
  var ox=pos.x, oy=pos.y+EYE, oz=pos.z;
  var px=-1,py=-1,pz=-1;
  for(var s=0;s<reach*40;s++){
    var d=s/40;
    var x=Math.floor(ox+dir.x*d), y=Math.floor(oy+dir.y*d), z=Math.floor(oz+dir.z*d);
    if(y<0||y>=WY) break;
    var t=getBlock(x,y,z);
    if(t!==AIR && !LIQUID[t]){
      if(x<0||z<0||x>=WX||z>=WZ) return null;
      return {x:x,y:y,z:z,px:px,py:py,pz:pz};
    }
    px=x; py=y; pz=z;
  }
  return null;
}
function playerBlocks(x,y,z){
  var minX=Math.floor(pos.x-PW/2), maxX=Math.floor(pos.x+PW/2);
  var minY=Math.floor(pos.y), maxY=Math.floor(pos.y+PH-0.001);
  var minZ=Math.floor(pos.z-PW/2), maxZ=Math.floor(pos.z+PW/2);
  return x>=minX&&x<=maxX&&y>=minY&&y<=maxY&&z>=minZ&&z<=maxZ;
}
function editBlock(x,y,z,t){
  setBlockRaw(x,y,z,t);
  noteTop(x,y,z,t);
  netQueueEdit(x,y,z,t);
  if(t!==AIR){
    var ci=((z/CH)|0)*NCX+((x/CH)|0);
    if(y+1>colTop[ci]) colTop[ci]=y+1;
  }
  edits.set(index(x,y,z),t);
  refreshBox(x,x,z,z);
  disturb(x,y,z);
  mapColumn(x,z);
  saveSoon();
}

function place(){
  var h=pick(6); if(!h||h.px<0||h.py<0||h.py>=WY) return;
  if(playerBlocks(h.px,h.py,h.pz)) return;
  var cur=getBlock(h.px,h.py,h.pz);
  if(cur!==AIR && !LIQUID[cur]) return;
  var t=heldBlock();
  if(!t){ toast("Nothing in that slot — mine some first."); return; }
  if(!creative && takeFromSlot(selected,1)===0) return;
  editBlock(h.px,h.py,h.pz,t);
  burst(h.px,h.py,h.pz,t,3,1.4);
  sfxPlace();
  onPlaced(t,h.px,h.py,h.pz);
}

// json() rejects `invalid_json` when the reply is not clean JSON, but hands back
// everything Claude wrote on err.text. A fence or a sentence of preamble is the
// usual cause, so pull the object out rather than charge the player another ask.
function extractJSON(t){
  if(!t||typeof t!=="string") return null;
  var start=t.indexOf("{");
  while(start>=0){
    var depth=0, inStr=false, esc=false;
    for(var i=start;i<t.length;i++){
      var c=t.charAt(i);
      if(esc){ esc=false; continue; }
      if(c==="\\"){ if(inStr) esc=true; continue; }
      if(c==='"'){ inStr=!inStr; continue; }
      if(inStr) continue;
      if(c==="{") depth++;
      else if(c==="}"){
        depth--;
        if(depth===0){
          try{
            var v=JSON.parse(t.slice(start,i+1));
            if(v&&typeof v==="object") return v;
          }catch(e){}
          break;
        }
      }
    }
    start=t.indexOf("{",start+1);
  }
  return null;
}

// match what was typed against the built-in content, by name, then by position
function matchOffline(text,names){
  var t=text.toLowerCase().replace(/[^a-z0-9 ]/g,"").trim(), i;
  for(i=0;i<names.length;i++) if(names[i].toLowerCase()===t) return i;
  for(i=0;i<names.length;i++){
    var n=names[i].toLowerCase();
    if(t.length>2&&(n.indexOf(t)>=0||t.indexOf(n)>=0)) return i;
  }
  var words=t.split(/\s+/);
  for(i=0;i<names.length;i++){
    var parts=names[i].toLowerCase().split(/\s+/);
    for(var w=0;w<words.length;w++)
      for(var p=0;p<parts.length;p++)
        if(words[w].length>3&&words[w]===parts[p]) return i;
  }
  var num=parseInt(t,10);
  if(!isNaN(num)&&num>=1&&num<=names.length) return num-1;
  return -1;
}

function applyPlan(plan,site){
  if(!plan||!plan.layers||!plan.layers.length) return {error:"The blueprint came back empty. Try again."};
  var layers=plan.layers;
  if(!Array.isArray(layers[0])||typeof layers[0][0]!=="string") return {error:"The blueprint wasn't shaped right. Try rephrasing."};
  var H=Math.min(layers.length,15), D=Math.min(layers[0].length,15), Wd=Math.min(layers[0][0].length,15);
  if(Wd<1||D<1) return {error:"The blueprint had no footprint. Try again."};
  var legend={}, k;
  if(plan.legend) for(k in plan.legend) legend[String(k).toLowerCase()]=blockId(plan.legend[k],STONE);
  var x0=site.x-((Wd/2)|0), z0=site.z-((D/2)|0), y0=site.y;
  var cells=[], solid=0;
  for(var y=0;y<H;y++){
    var layer=layers[y];
    for(var dz=0;dz<D;dz++){
      var row=(typeof layer[dz]==="string")?layer[dz]:"";
      for(var dx=0;dx<Wd;dx++){
        var ch=(dx<row.length)?row.charAt(dx):".";
        var t;
        if(ch==="."||ch===" "||ch==="_") t=AIR;
        else{
          t=legend[ch.toLowerCase()];
          if(t===undefined) t=STONE;
          if(t!==AIR) solid++;

        var wx=x0+dx, wy=y0+y, wz=z0+dz;
        if(wy<1||wy>=WY||wx<0||wx>=WX||wz<0||wz>=WZ) continue;
        var prev=getBlock(wx,wy,wz);
        if(prev===t) continue;
        cells.push([index(wx,wy,wz),prev,t]);

  if(solid>1400) return {error:"That design is too large for the world. Ask for something smaller."};
  if(!cells.length) return {error:"That design wouldn't change anything here. Try another spot."};

    var c=cells[i], ix=c[0];
    setBlockRaw(ix%WX,(ix/(WX*WZ))|0,((ix/WX)|0)%WZ,c[2]);

    edits.set(ix,c[2]);
  }
  lastBuild={cells:cells,name:plan.name||"Structure",box:[x0,x0+Wd-1,z0,z0+D-1]};
  refreshBox(x0,x0+Wd-1,z0,z0+D-1);
  for(var mx=x0;mx<x0+Wd;mx++) for(var mz=z0;mz<z0+D;mz++) mapColumn(mx,mz);

}

].join("\n");

function litBody(isWater){
  var a=[
    "vec3 N0 = normalize(vEcol);",
    "vec2 ms = tileMat(vUv);",
    "vec3 N = bumpNormal(N0, vUv);",
    "float skyA = pow(max(vLite.x,0.0),1.45);",
    "float sh = sunShade(vWPos)*cloudShade(vWPos);",
    "float ndl = max(dot(N, normalize(uSunDir)), 0.0);",
    "vec3 V = normalize(uCam - vWPos);",
    "vec3 Hv = normalize(normalize(uSunDir) + V);",
    "float spec = pow(max(dot(N,Hv),0.0), mix(8.0,170.0,ms.g)) * ms.r;",
    "vec3 lit = uAmb + uSky*(skyA*vLite.z*uDay*0.42) + uSunCol*(ndl*sh*skyA*uDay*0.78)",
    "         + uLamp*pow(vLite.y,1.70) + uSunCol*(spec*sh*skyA*uDay);",
    "lit = mix(lit, vEcol, step(0.5, -vLite.x));",
    "diffuseColor.rgb *= lit;"
  ];
  if(isWater){
    a=[
      "vec3 N = normalize(vec3(",
      "  sin(vWPos.x*0.7 + uTime*1.7)*0.16 + sin(vWPos.z*0.33 - uTime*1.1)*0.10,",
      "  1.0,",
      "  sin(vWPos.z*0.62 - uTime*1.4)*0.16 + sin(vWPos.x*0.29 + uTime*0.9)*0.10));",
      "float skyA = pow(max(vLite.x,0.0),1.45);",
      "float sh = sunShade(vWPos)*cloudShade(vWPos);",
      "vec3 V = normalize(uCam - vWPos);",
      "float fres = pow(1.0 - clamp(abs(dot(V, N)),0.0,1.0), 3.4);",
      "vec3 Hv = normalize(normalize(uSunDir) + V);",
      "float glint = pow(max(dot(N,Hv),0.0), 260.0)*1.5;",
      "float ndl = max(dot(N, normalize(uSunDir)), 0.0);",
      "vec3 lit = uAmb + uSky*(skyA*uDay*0.55) + uSunCol*(ndl*sh*skyA*uDay*0.5)",
      "         + uLamp*pow(vLite.y,1.70);",
      "diffuseColor.rgb *= lit;",
      "diffuseColor.rgb = mix(diffuseColor.rgb, uSky*uDay*0.9, fres*0.55);",
      "diffuseColor.rgb += uSunCol*glint*sh*skyA*uDay;"
    ];
  }
  return a.join("\n  ");
}

// Light is no longer baked into the vertex colors. Each vertex carries (skyAmount,
// blockAmount, faceShade) and the shader combines them with uniforms, so the sun can
// move and the whole world relights without touching a single buffer.
var U={
  uAmb:{value:new THREE.Vector3(0.09,0.10,0.13)},
  uSky:{value:new THREE.Vector3(0.96,0.99,1.00)},
  uLamp:{value:new THREE.Vector3(1.00,0.70,0.36)},
  uDay:{value:1.0}
};
function chunkMat(opts,isWater){
  opts.vertexColors=true; opts.map=atlasTex;
  var m=new THREE.MeshBasicMaterial(opts);
  m.onBeforeCompile=function(sh){
    sh.uniforms.uAmb=U.uAmb; sh.uniforms.uSky=U.uSky;
    sh.uniforms.uLamp=U.uLamp; sh.uniforms.uDay=U.uDay;
    sh.uniforms.uSunDir=SUN.uSunDir; sh.uniforms.uSunCol=SUN.uSunCol;
    sh.uniforms.uShadow=SUN.uShadow; sh.uniforms.uExposure=SUN.uExposure;
    sh.uniforms.uTime=SUN.uTime; sh.uniforms.uHS=SUN.uHS; sh.uniforms.uBumpAmt=SUN.uBumpAmt; sh.uniforms.uCam=SUN.uCam; sh.uniforms.uCloudAmt=SUN.uCloudAmt;
    sh.uniforms.uHeight={value:heightTex};
    sh.uniforms.uMat={value:matTex};
    sh.uniforms.uBump={value:bumpTex};
    var wave=isWater
      ? "  if(ecol.x > 0.5){ transformed.y += sin(position.x*0.7 + uTime*1.7)*0.055 + sin(position.z*0.45 - uTime*1.2)*0.045; }\n"
      : "";
    sh.vertexShader="attribute vec3 ecol;\nuniform float uTime;\nvarying vec3 vLite;\nvarying vec3 vEcol;\nvarying vec3 vWPos;\n"+
      sh.vertexShader.replace("#include <begin_vertex>",
        "#include <begin_vertex>\n  vLite = color;\n  vEcol = ecol;\n"+wave+"  vWPos = transformed;");
    sh.fragmentShader=GLSL_HEAD+"\n"+GLSL_FNS+"\n"+
      sh.fragmentShader.replace("#include <color_fragment>", litBody(isWater));
  };
  m.customProgramCacheKey=function(){ return isWater?"blockfall-water":"blockfall-lit"; };
  return m;
}

var tod=0.34, todSpeed=1, DAY_SECONDS=420;
var SPEEDS=[0,1,6], speedNames=["frozen","normal","fast"], speedIdx=1;
var baseSky={}, nightMix=0.86;
var sunHeight=1, nightAmt=0, moonDir=new THREE.Vector3(0,1,0);

function toRGB(h){ var n=parseInt(h.slice(1),16); return [((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255]; }
function mix3(a,b,t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function setCol(c,v){ c.setRGB(clamp(v[0],0,1),clamp(v[1],0,1),clamp(v[2],0,1)); }

function applyRecipeLook(){
  baseSky.top=toRGB(W.sky.top); baseSky.mid=toRGB(W.sky.mid); baseSky.low=toRGB(W.sky.low);
  baseSky.sun=toRGB(W.sky.sun); baseSky.fog=toRGB(W.fog.color);
  baseSky.amb=toRGB(W.ambientColor);
  var NIGHT=[0.016,0.022,0.045];
  baseSky.nTop=mix3(baseSky.top,NIGHT,nightMix);
  baseSky.nMid=mix3(baseSky.mid,NIGHT,nightMix-0.08);
  baseSky.nLow=mix3(baseSky.low,NIGHT,nightMix-0.16);
  baseSky.nFog=mix3(baseSky.fog,NIGHT,nightMix-0.14);
  var warm=mix3(baseSky.sun,[0.92,0.33,0.18],0.45);
  baseSky.dMid=mix3(baseSky.mid,warm,0.55);
  baseSky.dLow=mix3(baseSky.low,warm,0.72);
  baseSky.dFog=mix3(baseSky.fog,warm,0.55);
  var mx=Math.max(baseSky.sun[0],baseSky.sun[1],baseSky.sun[2])||1;
  baseSky.skyTint=[baseSky.sun[0]/mx*0.3+0.7, baseSky.sun[1]/mx*0.3+0.7, baseSky.sun[2]/mx*0.3+0.7];
  if(cloudMesh) cloudMesh.material.opacity=W.clouds;
  SUN.uCloudAmt.value=W.clouds;
  var root=document.documentElement.style;
  root.setProperty("--sky-top",W.sky.top);
  root.setProperty("--sky-mid",W.sky.mid);
  root.setProperty("--sky-low",W.sky.low);
  updateTime(0);
}
function updateTime(dt){
  if(todSpeed>0) tod=(tod+dt*todSpeed/DAY_SECONDS)%1;
  var h=Math.sin((tod-0.25)*Math.PI*2);
  sunHeight=h;
  var maxEl=W.sky.el*Math.PI/180;
  var el=maxEl*h + (h<0?-0.12:0);
  var az=(W.sky.az+(tod-0.5)*150)*Math.PI/180;
  sunDir.set(Math.cos(el)*Math.sin(az), Math.sin(el), Math.cos(el)*Math.cos(az)).normalize();
  moonDir.copy(sunDir).multiplyScalar(-1);

  var day=clamp(h*1.6+0.30,0,1);
  var dusk=clamp(1-Math.abs(h)*5.0,0,1);
  nightAmt=clamp(1-(h*4.0+0.80),0,1);

  var top=mix3(baseSky.nTop,baseSky.top,day);
  var mid=mix3(baseSky.nMid,baseSky.mid,day);
  var low=mix3(baseSky.nLow,baseSky.low,day);
  var fg =mix3(baseSky.nFog,baseSky.fog,day);
  mid=mix3(mid,baseSky.dMid,dusk*0.8);
  low=mix3(low,baseSky.dLow,dusk*0.85);
  fg =mix3(fg ,baseSky.dFog,dusk*0.7);

  setCol(skyMat.uniforms.cTop.value,top);
  setCol(skyMat.uniforms.cMid.value,mid);
  setCol(skyMat.uniforms.cLow.value,low);
  setCol(skyMat.uniforms.cSun.value,baseSky.sun);
  skyMat.uniforms.uNight.value=nightAmt;
  skyMat.uniforms.uSunUp.value=clamp(h*6.0+0.5,0,1);
  skyMat.uniforms.moonDir.value.copy(moonDir);

  SUN.uSunDir.value.copy(sunDir);
  var warmth=clamp(1-Math.abs(h)*2.2,0,1);
  var sc=mix3(baseSky.sun,[1.0,0.52,0.26],warmth*0.65);
  var strength=clamp(h*2.0+0.12,0.05,1);
  SUN.uSunCol.value.set(sc[0]*strength,sc[1]*strength,sc[2]*strength);
  SUN.uShadow.value=(shadowsOn && h>0.10)?1.0:0.0;
  skyNowFog=fg;
  var lvl=W.daylight*(0.07+0.93*day);
  U.uDay.value=lvl;
  var ambScale=W.ambientLevel*2.2*(0.42+0.58*day);
  U.uAmb.value.set(baseSky.amb[0]*ambScale+0.028, baseSky.amb[1]*ambScale+0.030, baseSky.amb[2]*ambScale+0.040);
  U.uSky.value.set(baseSky.skyTint[0],baseSky.skyTint[1],baseSky.skyTint[2]);
  if(cloudMesh){
    var c=cloudMesh.material.color;
    c.setRGB(0.25+0.75*day,0.27+0.73*day,0.32+0.68*day);
  }
}
var skyNowFog=[0.73,0.86,0.94];
function acesJS(c,e){
  var o=[0,0,0];
  for(var i=0;i<3;i++){
    var v=c[i]*e;
    o[i]=clamp((v*(2.51*v+0.03))/(v*(2.43*v+0.59)+0.14),0,1);
  }
  return o;
}
function clockText(){
  var mins=Math.floor(tod*1440), hh=Math.floor(mins/60), mm=mins%60;
  return (hh<10?"0":"")+hh+":"+(mm<10?"0":"")+mm;
}
function cycleTime(){
  speedIdx=(speedIdx+1)%SPEEDS.length;
  todSpeed=SPEEDS[speedIdx];
  toast("Time "+speedNames[speedIdx]+" · "+clockText());
  saveSoon();
}

var AC=null, master=null, muffle=null, noiseBuf=null, windGain=null, audioOn=true, rumbleGain=null;
function initAudio(){
  if(AC||!audioOn) return;
  var Ctor=window.AudioContext||window.webkitAudioContext;
  if(!Ctor) return;
  try{ AC=new Ctor(); }catch(e){ AC=null; return; }
  master=AC.createGain(); master.gain.value=0.45;
  muffle=AC.createBiquadFilter(); muffle.type="lowpass"; muffle.frequency.value=20000;
  master.connect(muffle); muffle.connect(AC.destination);
  var n=AC.sampleRate*2;
  noiseBuf=AC.createBuffer(1,n,AC.sampleRate);
  var d=noiseBuf.getChannelData(0);
  for(var i=0;i<n;i++) d[i]=Math.random()*2-1;
  // wind bed
  var w=AC.createBufferSource(); w.buffer=noiseBuf; w.loop=true;
  var wf=AC.createBiquadFilter(); wf.type="bandpass"; wf.frequency.value=480; wf.Q.value=0.6;
  windGain=AC.createGain(); windGain.gain.value=0.0;
  w.connect(wf); wf.connect(windGain); windGain.connect(master); w.start();
  // low rumble for lava country
  var r=AC.createBufferSource(); r.buffer=noiseBuf; r.loop=true;
  var rf=AC.createBiquadFilter(); rf.type="lowpass"; rf.frequency.value=110;
  rumbleGain=AC.createGain(); rumbleGain.gain.value=0.0;
  r.connect(rf); rf.connect(rumbleGain); rumbleGain.connect(master); r.start();
}
function resumeAudio(){
  initAudio();
  if(AC && AC.state==="suspended"){ try{ AC.resume(); }catch(e){} }
}
function noiseHit(freq,q,dur,vol,type){
  if(!AC||!audioOn) return;
  var s=AC.createBufferSource(); s.buffer=noiseBuf;
  s.playbackRate.value=0.7+Math.random()*0.6;
  var f=AC.createBiquadFilter(); f.type=type||"bandpass"; f.frequency.value=freq; f.Q.value=q;
  var g=AC.createGain();
  var t=AC.currentTime;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.006);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(f); f.connect(g); g.connect(master);
  s.start(t); s.stop(t+dur+0.02);
}
function tone(freq,dur,vol,type,slideTo){
  if(!AC||!audioOn) return;
  var o=AC.createOscillator(); o.type=type||"sine";
  var g=AC.createGain(); var t=AC.currentTime;
  o.frequency.setValueAtTime(freq,t);
  if(slideTo) o.frequency.exponentialRampToValueAtTime(slideTo,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t+dur+0.02);
}

    parts.push({x:x+Math.random(),y:y+Math.random(),z:z+Math.random(),

var pCleared=true;
function stepParticles(dt){
  var i=0;
  if(!parts.length && pCleared) return;
  while(i<parts.length){
    var p=parts[i];
    p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    if(!p.float) p.vy-=17*dt; else p.vy*=0.97;
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.z+=p.vz*dt;
    if(!p.float && isSolid(Math.floor(p.x),Math.floor(p.y),Math.floor(p.z))){
      p.y=Math.floor(p.y)+1.02; p.vy=0; p.vx*=0.4; p.vz*=0.4;
    }
    i++;
  }
  var n=parts.length;
  for(i=0;i<PMAX;i++){
    var o=i*3;
    if(i<n){
      pCleared=false;
      var q=parts[i], f=clamp(q.life*2.2,0,1);
      pPos[o]=q.x; pPos[o+1]=q.y; pPos[o+2]=q.z;
      pCol[o]=q.r*f; pCol[o+1]=q.g*f; pCol[o+2]=q.b*f;
    }else{
      pPos[o]=0; pPos[o+1]=-999; pPos[o+2]=0;
      pCol[o]=pCol[o+1]=pCol[o+2]=0;
    }
  }
  pGeo.attributes.position.needsUpdate=true;
  pGeo.attributes.color.needsUpdate=true;
  pCleared=(parts.length===0);
}

    if(!c.alive){ continue; }
    var dxp=c.x-pos.x, dzp=c.z-pos.z;
    var dp=Math.sqrt(dxp*dxp+dzp*dzp);
    if(dp>62){ c.alive=placeCritter(c,true); c.mesh.visible=c.alive; continue; }
    var spd=1.6;
    c.timer-=dt;
    if(dp<7){ c.dir=Math.atan2(dzp,dxp); spd=4.2; c.timer=0.5; }
    else if(c.timer<=0){ c.dir+=(Math.random()-0.5)*2.4; c.timer=1.2+Math.random()*2.6; }
    var nx=c.x+Math.cos(c.dir)*spd*dt, nz=c.z+Math.sin(c.dir)*spd*dt;
    var footY=c.y+0.1;
    if(!critterSolid(nx,footY,c.z)) c.x=nx;
    else if(!critterSolid(nx,footY+1,c.z) && critterSolid(nx,footY,c.z)){ c.x=nx; c.y+=1; }
    else c.dir+=2.0;
    if(!critterSolid(c.x,footY,nz)) c.z=nz;
    else if(!critterSolid(c.x,footY+1,nz) && critterSolid(c.x,footY,nz)){ c.z=nz; c.y+=1; }
    else c.dir+=2.0;
    c.vy-=22*dt; c.y+=c.vy*dt;
    if(critterSolid(c.x,c.y,c.z)){ c.y=Math.floor(c.y)+1; c.vy=0; }
    if(c.y<-4||c.x<1||c.z<1||c.x>WX-1||c.z>WZ-1){ c.alive=placeCritter(c,true); c.mesh.visible=c.alive; continue; }
    c.mesh.position.set(c.x,c.y+Math.abs(Math.sin(now*0.004+c.phase))*0.07,c.z);
    c.mesh.rotation.y=-c.dir+Math.PI/2;
  }
}

// ================================================================ falling blocks and reactions
var FALLER={}; FALLER[SAND]=1; FALLER[ASH]=1; FALLER[SNOW]=1;
var physQ=[], physSeen={}, physDirty=null;
function disturb(x,y,z){
  for(var dx=-1;dx<=1;dx++) for(var dy=-1;dy<=2;dy++) for(var dz=-1;dz<=1;dz++){
    var ax=x+dx, ay=y+dy, az=z+dz;
    if(ax<0||az<0||ay<1||ax>=WX||ay>=WY||az>=WZ) continue;
    var k=index(ax,ay,az);
    if(physSeen[k]) continue;
    physSeen[k]=1; physQ.push(k);
  }
}
function markDirty(x,z){
  if(!physDirty) physDirty={x0:x,x1:x,z0:z,z1:z};
  else{
    if(x<physDirty.x0) physDirty.x0=x;
    if(x>physDirty.x1) physDirty.x1=x;
    if(z<physDirty.z0) physDirty.z0=z;
    if(z>physDirty.z1) physDirty.z1=z;
  }
}
function physSet(x,y,z,t){
  setBlockRaw(x,y,z,t);
  noteTop(x,y,z,t);
  if(t!==AIR){
    var ci=((z/CH)|0)*NCX+((x/CH)|0);
    if(y+1>colTop[ci]) colTop[ci]=y+1;
  }
  edits.set(index(x,y,z),t);
  markDirty(x,z);
  mapColumn(x,z);
}
function physTick(){
  if(!physQ.length) return;
  var budget=260, moved=false;
  while(physQ.length && budget-- > 0){
    var k=physQ.shift();
    physSeen[k]=0;
    var x=k%WX, z=((k/WX)|0)%WZ, y=(k/(WX*WZ))|0;
    var t=getBlock(x,y,z);
    if(t===AIR) continue;
    // lava quenches against water
    if(t===LAVA){
      var touched=false;
      if(getBlock(x+1,y,z)===WATER||getBlock(x-1,y,z)===WATER||getBlock(x,y,z+1)===WATER||
         getBlock(x,y,z-1)===WATER||getBlock(x,y+1,z)===WATER||getBlock(x,y-1,z)===WATER) touched=true;
      if(touched){
        physSet(x,y,z,BASALT);
        steam(x,y+1,z,5); sfxHiss();
        disturb(x,y,z); moved=true;
        continue;
      }
    }
    // loose material falls
    if(FALLER[t]){
      var ny=y;
      while(ny>1){
        var below=getBlock(x,ny-1,z);
        if(below===AIR||LIQUID[below]) ny--; else break;
      }
      if(ny!==y){
        physSet(x,y,z,AIR);
        physSet(x,ny,z,t);
        burst(x,ny,z,t,3,1.6);
        disturb(x,y,z); disturb(x,ny,z);
        moved=true;
      }
    }
  }
  if(moved||physDirty){
    var d=physDirty; physDirty=null;
    if(d) refreshBox(d.x0,d.x1,d.z0,d.z1);
  }
}

// ================================================================ minimap
var mapOn=true, mapDirty=true, mapTimer=0;
var mapBase=document.createElement("canvas"); mapBase.width=mapBase.height=WX;
var mapBCtx=mapBase.getContext("2d");
var elMap=document.getElementById("minimap");
var mapCtx=elMap?elMap.getContext("2d"):null;
function drawMapBase(){
  var img=mapBCtx.createImageData(WX,WZ), d=img.data;
  for(var z=0;z<WZ;z++) for(var x=0;x<WX;x++){
    var y=WY-1, t=AIR;
    for(;y>0;y--){ t=getBlock(x,y,z); if(t!==AIR) break; }
    var c=BLOCK_RGB[t]||[0.1,0.12,0.15];
    var shade=0.55+0.45*clamp((y-4)/(WY-12),0,1);
    var i=(z*WX+x)*4;
    d[i]=clamp(c[0]*shade*255,0,255); d[i+1]=clamp(c[1]*shade*255,0,255);
    d[i+2]=clamp(c[2]*shade*255,0,255); d[i+3]=255;
  }
  mapBCtx.putImageData(img,0,0);
  mapDirty=false;
}
function mapColumn(x,z){
  if(x<0||z<0||x>=WX||z>=WZ) return;
  var y=WY-1, t=AIR;
  for(;y>0;y--){ t=getBlock(x,y,z); if(t!==AIR) break; }
  var c=BLOCK_RGB[t]||[0.1,0.12,0.15];
  var shade=0.55+0.45*clamp((y-4)/(WY-12),0,1);
  mapBCtx.fillStyle="rgb("+Math.round(clamp(c[0]*shade*255,0,255))+","+
    Math.round(clamp(c[1]*shade*255,0,255))+","+Math.round(clamp(c[2]*shade*255,0,255))+")";
  mapBCtx.fillRect(x,z,1,1);
}
function drawMap(){
  if(!mapCtx||!elMap) return;
  if(mapDirty) drawMapBase();
  var s=elMap.width;
  mapCtx.clearRect(0,0,s,s);
  mapCtx.imageSmoothingEnabled=false;
  mapCtx.drawImage(mapBase,0,0,s,s);
  // story target
  var b=(typeof activeBeat==="function")?activeBeat():null;
  if(b&&b.pos){
    mapCtx.fillStyle="#ffb347";
    mapCtx.fillRect(b.pos.x/WX*s-2,b.pos.z/WZ*s-2,4,4);
  }
  // player, pointing where you look
  var px=pos.x/WX*s, pz=pos.z/WZ*s;
  mapCtx.save();
  mapCtx.translate(px,pz);
  mapCtx.rotate(-yaw);
  mapCtx.fillStyle="#ffffff";
  mapCtx.beginPath();
  mapCtx.moveTo(0,-5); mapCtx.lineTo(3.5,4); mapCtx.lineTo(0,2); mapCtx.lineTo(-3.5,4);
  mapCtx.closePath(); mapCtx.fill();
  mapCtx.restore();
}

function buildSettings(){

// ================================================================ offline content
// Everything Claude can do at runtime has a hand-built counterpart, so a person the
// page is shared with — who has no Claude session of their own — still gets a whole
// game instead of a dead button. Blueprints are generated rather than typed out, so
// their layers are guaranteed rectangular and consistent.
function bpGrid(w,d,ch){
  var rows=[], x;
  for(var z=0;z<d;z++){
    var r="";
    for(x=0;x<w;x++) r+=ch;
    rows.push(r);
  }
  return rows;
}
function bpSet(rows,x,z,ch){
  if(z<0||z>=rows.length) return;
  var r=rows[z];
  if(x<0||x>=r.length) return;
  rows[z]=r.substring(0,x)+ch+r.substring(x+1);
}
function bpRing(rows,x0,z0,x1,z1,ch){
  for(var x=x0;x<=x1;x++){ bpSet(rows,x,z0,ch); bpSet(rows,x,z1,ch); }
  for(var z=z0;z<=z1;z++){ bpSet(rows,x0,z,ch); bpSet(rows,x1,z,ch); }
}
function bpFill(rows,x0,z0,x1,z1,ch){
  for(var x=x0;x<=x1;x++) for(var z=z0;z<=z1;z++) bpSet(rows,x,z,ch);
}

function bpWatchtower(){
  var W2=7, D=7, H=13, layers=[], y, mid=3;
  for(y=0;y<H;y++){
    var rows=bpGrid(W2,D,".");
    if(y===0){ bpFill(rows,1,1,5,5,"f"); bpRing(rows,0,0,6,6,"s"); bpSet(rows,mid,6,"."); bpSet(rows,mid,0,"."); }
    else if(y===1){ bpRing(rows,0,0,6,6,"s"); bpSet(rows,mid,6,"."); bpSet(rows,mid,0,"."); bpSet(rows,1,1,"t"); }
    else if(y<H-3){
      bpRing(rows,0,0,6,6,"s");
      if(y%3===2){ bpSet(rows,0,mid,"g"); bpSet(rows,6,mid,"g"); bpSet(rows,mid,0,"g"); bpSet(rows,mid,6,"g"); }
      // a stair winding up the inside wall, one step per level
      var step=[[1,1],[5,1],[5,5],[1,5]][y%4];
      bpSet(rows,step[0],step[1],"b");
      if(y===H-4) bpSet(rows,mid,mid,"l");
    }
    else if(y===H-3){ bpFill(rows,0,0,6,6,"f"); bpSet(rows,mid,mid,"."); }
    else if(y===H-2){ bpRing(rows,0,0,6,6,"s"); bpSet(rows,mid,mid,"l"); }
    else { bpRing(rows,0,0,6,6,"b"); }
    layers.push(rows);
  }
  return {name:"Watchtower",legend:{s:"cobble",f:"planks",g:"glass",l:"lamp",b:"slab",t:"lamp"},layers:layers};
}
function bpCabin(){
  var W2=9, D=7, H=6, layers=[], y;
  for(y=0;y<H;y++){
    var rows=bpGrid(W2,D,".");
    if(y===0){ bpFill(rows,0,0,8,6,"f"); }
    else if(y<4){
      bpRing(rows,0,0,8,6,"p");
      bpSet(rows,0,0,"w"); bpSet(rows,8,0,"w"); bpSet(rows,0,6,"w"); bpSet(rows,8,6,"w");
      if(y===1||y===2){ bpSet(rows,4,6,"."); }           // doorway
      if(y===2){ bpSet(rows,2,0,"g"); bpSet(rows,6,0,"g"); bpSet(rows,0,3,"g"); bpSet(rows,8,3,"g"); }
      if(y===2){ bpSet(rows,2,2,"l"); }
    }
    else if(y===4){ bpFill(rows,0,0,8,6,"b"); }
    else { bpFill(rows,2,1,6,5,"b"); }
    layers.push(rows);
  }
  return {name:"Cabin",legend:{f:"planks",p:"planks",w:"log",g:"glass",l:"lamp",b:"slab"},layers:layers};
}
function bpChapel(){
  var W2=9, D=13, H=9, layers=[], y;
  for(y=0;y<H;y++){
    var rows=bpGrid(W2,D,".");
    if(y===0){ bpFill(rows,0,0,8,12,"f"); }
    else if(y<6){
      bpRing(rows,0,0,8,12,"s");
      if(y<3) bpSet(rows,4,12,".");                       // doors
      if(y>1&&y<5){ bpSet(rows,0,4,"g"); bpSet(rows,8,4,"g"); bpSet(rows,0,8,"g"); bpSet(rows,8,8,"g"); bpSet(rows,4,0,"g"); }
      if(y===2){ bpSet(rows,2,2,"l"); bpSet(rows,6,10,"l"); }
    }
    else if(y===6){ bpFill(rows,0,0,8,12,"b"); }
    else if(y===7){ bpFill(rows,2,2,6,10,"b"); bpSet(rows,4,1,"o"); }
    else { bpSet(rows,4,1,"l"); bpFill(rows,3,5,5,7,"b"); }
    layers.push(rows);
  }
  return {name:"Chapel",legend:{f:"cobble",s:"cobble",g:"glass",l:"lamp",b:"slab",o:"post"},layers:layers};
}
function bpWindmill(){
  var W2=7, D=7, H=12, layers=[], y;
  for(y=0;y<H;y++){
    var rows=bpGrid(W2,D,".");
    if(y===0){ bpFill(rows,1,1,5,5,"f"); bpRing(rows,0,0,6,6,"s"); bpSet(rows,3,6,"."); }
    else if(y<8){
      bpRing(rows,1,1,5,5,"s");
      if(y===2){ bpSet(rows,3,5,"."); bpSet(rows,2,2,"l"); }
      if(y===4){ bpSet(rows,1,3,"g"); bpSet(rows,5,3,"g"); }
    }
    else if(y===8){ bpFill(rows,1,1,5,5,"b"); }
    else if(y===9){ bpSet(rows,3,3,"w"); bpSet(rows,3,1,"w"); bpSet(rows,3,5,"w"); }
    else if(y===10){ bpSet(rows,3,3,"w"); bpSet(rows,1,3,"w"); bpSet(rows,5,3,"w"); bpSet(rows,3,0,"w"); bpSet(rows,3,6,"w"); }
    else { bpSet(rows,3,3,"l"); bpSet(rows,0,3,"w"); bpSet(rows,6,3,"w"); }
    layers.push(rows);
  }
  return {name:"Windmill",legend:{f:"planks",s:"cobble",g:"glass",l:"lamp",b:"slab",w:"post"},layers:layers};
}
function bpBridge(){
  var W2=15, D=5, H=6, layers=[], y;
  for(y=0;y<H;y++){
    var rows=bpGrid(W2,D,".");
    if(y===0){ bpFill(rows,0,1,14,3,"s"); }
    else if(y===1){ bpFill(rows,0,1,2,3,"s"); bpFill(rows,12,1,14,3,"s"); bpFill(rows,3,1,11,3,"b"); }
    else if(y===2){ bpSet(rows,0,1,"o"); bpSet(rows,0,3,"o"); bpSet(rows,14,1,"o"); bpSet(rows,14,3,"o");
                    bpSet(rows,7,1,"o"); bpSet(rows,7,3,"o"); }
    else if(y===3){ bpSet(rows,0,1,"l"); bpSet(rows,14,3,"l"); bpSet(rows,7,1,"o"); bpSet(rows,7,3,"o"); }
    else if(y===4){ bpSet(rows,7,1,"l"); bpSet(rows,7,3,"l"); }
    layers.push(rows);
  }
  return {name:"Bridge",legend:{s:"cobble",b:"slab",o:"post",l:"lamp"},layers:layers};
}
function bpWell(){
  var W2=5, D=5, H=6, layers=[], y;
  for(y=0;y<H;y++){
    var rows=bpGrid(W2,D,".");
    if(y===0){ bpRing(rows,0,0,4,4,"s"); bpRing(rows,1,1,3,3,"s"); bpSet(rows,2,2,"."); }
    else if(y===1){ bpRing(rows,1,1,3,3,"s"); }
    else if(y===2){ bpSet(rows,1,1,"o"); bpSet(rows,3,3,"o"); }
    else if(y===3){ bpSet(rows,1,1,"o"); bpSet(rows,3,3,"o"); bpSet(rows,2,2,"l"); }
    else if(y===4){ bpFill(rows,1,1,3,3,"b"); }
    layers.push(rows);
  }
  return {name:"Well",legend:{s:"cobble",o:"post",l:"lamp",b:"slab"},layers:layers};
}

var OFFLINE_BUILDS=null;
function offlineBuilds(){
  if(!OFFLINE_BUILDS) OFFLINE_BUILDS=[bpWatchtower(),bpCabin(),bpChapel(),bpWindmill(),bpBridge(),bpWell()];
  return OFFLINE_BUILDS;
}

// fill a stock story's tasks with blocks this world actually has
function offlineStory(i){
  var src=OFFLINE_STORIES[i%OFFLINE_STORIES.length];
  var pal=W.palette;
  function pick(prefer){
    for(var p=0;p<prefer.length;p++) if(pal.indexOf(prefer[p])>=0) return prefer[p];
    return pal[0];
  }
  var mineBlock=pick([STONE,COBBLE,BASALT,DIRT,CLAY,SAND]);
  var placeBlock=pick([COBBLE,PLANK,STONE,CLAY,BASALT,SAND]);
  var out={title:src.title,opening:src.opening,ending:src.ending,beats:[]};
  for(var b=0;b<src.beats.length;b++){
    var s0=src.beats[b], t=s0.task;
    var task={kind:t.kind,count:t.count||1};
    if(t.kind==="mine") task.block=NAMES[mineBlock].toLowerCase();
    if(t.kind==="place") task.block=NAMES[placeBlock].toLowerCase();
    var goal=s0.goal;
    if(t.kind==="mine") goal=goal.replace("the local stone",NAMES[mineBlock].toLowerCase())
                                 .replace("building stone",NAMES[mineBlock].toLowerCase());
    out.beats.push({name:s0.name,goal:goal,hint:s0.hint,arrive:s0.arrive,
                    site:s0.site,landmark:s0.landmark,task:task});
  }
  return out;
}

// ================================================================ shared worlds
// Two people are "in the same world" when three things line up: identical terrain,
// each other's positions, and each other's block edits. Terrain comes from a fixed
// seed so every fresh viewer generates the same ground. Positions ride on room

var roomApi=null, userApi=null, myName="", peerMeshes={}, peerCount=0, netReady=false;

function peerColor(key){
  var h=0;
  for(var i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))>>>0;
  return new THREE.Color().setHSL((h%360)/360,0.62,0.56);
}
function makeAvatar(key){
  var g=new THREE.Group();
  var col=peerColor(key);
  var body=new THREE.Mesh(new THREE.BoxGeometry(0.56,0.76,0.32),
    new THREE.MeshBasicMaterial({color:col}));
  body.position.y=0.86;
  var head=new THREE.Mesh(new THREE.BoxGeometry(0.46,0.44,0.44),
    new THREE.MeshBasicMaterial({color:col.clone().multiplyScalar(1.22)}));
  head.position.y=1.52;
  var face=new THREE.Mesh(new THREE.BoxGeometry(0.30,0.08,0.03),
    new THREE.MeshBasicMaterial({color:0x14181c}));
  face.position.set(0,1.56,-0.23);
  var legMat=new THREE.MeshBasicMaterial({color:col.clone().multiplyScalar(0.62)});
  var l1=new THREE.Mesh(new THREE.BoxGeometry(0.20,0.50,0.22),legMat);
  l1.position.set(-0.15,0.25,0);
  var l2=new THREE.Mesh(new THREE.BoxGeometry(0.20,0.50,0.22),legMat);
  l2.position.set(0.15,0.25,0);
  // a tall marker so you can spot each other across a city
  var pin=new THREE.Mesh(new THREE.BoxGeometry(0.12,1.1,0.12),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:0.55,fog:false}));
  pin.position.y=2.6;
  g.add(body); g.add(head); g.add(face); g.add(l1); g.add(l2); g.add(pin);
  g.userData.head=head; g.userData.face=face;
  peerGroup.add(g);
  return g;
}
function dropAvatar(key){
  var m=peerMeshes[key];
  if(!m) return;
  peerGroup.remove(m);
  delete peerMeshes[key];
}

function netSendPresence(){
  if(!roomApi) return;
  var p={
    x:Math.round((driving?driving.x:pos.x)*10)/10,
    y:Math.round((driving?driving.y:pos.y)*10)/10,
    z:Math.round((driving?driving.z:pos.z)*10)/10,
    r:Math.round(yaw*100)/100,
    car:driving?1:0,
    w:W.name,
    sd:seed
  };
  if(myName) p.n=myName;
  var wc=worldCode();
  if(wc&&wc.length<1400) p.cd=wc;
  try{ roomApi.presence(p); }catch(e){}
}
function netReadPeers(){
  if(!roomApi){ netPeerList=[]; peerCount=0; return; }
  var list=[], seen={}, i;
  try{ list=roomApi.peers()||[]; }catch(e){ return; }
  var n=0, info=[];
  for(i=0;i<list.length;i++){
    var pr=list[i];
    if(pr.kind!=="viewer") continue;
    var pd=pr.presence||{};
    var hasPos=(typeof pd.x==="number"&&typeof pd.z==="number");
    var same=(pd.sd===undefined)||(pd.sd===seed);
    info.push({me:!!pr.isMe,name:(typeof pd.n==="string"?pd.n:""),
               world:(typeof pd.w==="string"?pd.w:""),same:same,ready:hasPos,
               code:(typeof pd.cd==="string"?pd.cd:""),
               guest:!!pr.guest,col:"#"+peerColor(pr.peer).getHexString()});
    if(pr.isMe||!hasPos) continue;
    if(!same) continue;                      // drawn only when you share a world
    n++;
    var key=pr.peer;
    seen[key]=1;
    var m=peerMeshes[key]||(peerMeshes[key]=makeAvatar(key));
    m.visible=true;
    m.position.set(pd.x,pd.y||0,pd.z);
    m.rotation.y=(typeof pd.r==="number")?pd.r:0;
    m.scale.setScalar(pd.car?1.35:1);
  }
  for(var k in peerMeshes) if(!seen[k]) dropAvatar(k);
  peerCount=n;
  netPeerList=info;
}

// ---- block edits travel as small batches
function netQueueEdit(x,y,z,t){
  if(!roomApi||!netTopicOk||netApplying) return;
  netOutbox.push(x,y,z,t);
  if(netOutbox.length>240) netOutbox.splice(0,netOutbox.length-240);
}
function netFlush(){
  if(!roomApi||!netTopicOk||!netOutbox.length) return;
  var batch=netOutbox.splice(0,120);
  try{
    roomApi.emit("edit",{v:1,sd:seed,c:batch}).then(null,function(err){
      if(err&&err.code==="not_permitted"){
        netTopicOk=false;
        toast("You can see each other, but only an editor can share block changes.");
      }
    });
  }catch(e){}
}
function netApplyEdits(list){
  if(!list||!list.length) return;
  netApplying=true;
  var minx=1e9,maxx=-1e9,minz=1e9,maxz=-1e9;
  for(var i=0;i+3<list.length+1;i+=4){
    var x=list[i]|0, y=list[i+1]|0, z=list[i+2]|0, t=list[i+3]|0;
    if(x<0||z<0||y<1||x>=WX||y>=WY||z>=WZ) continue;
    if(!NAMES[t]&&t!==AIR) continue;
    setBlockRaw(x,y,z,t);
    noteTop(x,y,z,t);
    edits.set(index(x,y,z),t);
    mapColumn(x,z);
    if(x<minx)minx=x; if(x>maxx)maxx=x;
    if(z<minz)minz=z; if(z>maxz)maxz=z;
  }
  if(maxx>=minx) refreshBox(minx,maxx,minz,maxz);
  netApplying=false;
}

function netInit(){
  if(netAsked) return;
  netAsked=true;
  if(!window.claude||!window.claude.use){ netState="unavailable"; netErr="This page is not running inside Claude."; return; }
  window.claude.use("user").then(function(u){
    userApi=u||null;
    if(userApi&&userApi.me){
      try{
        userApi.me().then(function(me){
          if(me&&me.name) myName=String(me.name).slice(0,24);
        },function(){});
      }catch(e){}
    }
  },function(){});
  window.claude.use("room").then(function(r){
    if(!r){
      netState="refused";
      netErr="Live play needs you signed in to Claude, and the page shared with you by invite rather than a public link.";
      return;
    }
    roomApi=r; netReady=true; netState="joining";
    function fail(e){
      var code=(e&&e.code)||"unknown";
      roomApi=null; netState="refused";
      netErr=(code==="not_granted")
        ? "This viewer cannot join: sign in to Claude, and ask to be invited to the page rather than given the public link."
        : ("The live channel dropped ("+code+").");
      netPeerList=[];
      for(var pk in peerMeshes) dropAvatar(pk);
      peerCount=0;
    }
    try{
      roomApi.onPeers(function(){ netReadPeers(); },fail);
      roomApi.on("edit",function(msg){
        if(msg.isMe) return;
        var d=msg.data;
        if(!d||d.v!==1||!d.c||d.sd!==seed) return;
        netApplyEdits(d.c);
      },fail);
      if(roomApi.onConnection) roomApi.onConnection(function(up){
        netState=up?"live":"joining";
      },fail);
    }catch(e){ fail(e); }
    netSendPresence();
  },function(e){
    roomApi=null; netState="refused";
    netErr="Live play is not available to this viewer. Sign in to Claude and open an invited link.";
  });
}

// ---- world codes: the same code always builds the same world, no account needed
function presetKeyOf(rec){
  var ks=Object.keys(PRESET_WORLDS);
  for(var i=0;i<ks.length;i++) if(PRESET_WORLDS[ks[i]].name===rec.name) return ks[i];
  if(rec.name===defaultRecipe().name) return "home";
  return null;
}
function b64enc(str){
  var ascii=str.replace(/[\u0080-\uffff]/g,function(c){
    return "\\u"+("000"+c.charCodeAt(0).toString(16)).slice(-4);
  });
  try{ return btoa(ascii).replace(/=+$/,"").replace(/\+/g,"-").replace(/\//g,"_"); }
  catch(e){ return ""; }
}
function b64dec(str){
  try{
    var t=String(str).replace(/-/g,"+").replace(/_/g,"/");
    while(t.length%4) t+="=";
    return atob(t);
  }catch(e){ return ""; }
}
// only the fields that actually shape a world travel in a code
function packRecipe(rec){
  return {n:rec.name,no:rec.note,st:rec.style,ba:rec.base,am:rec.amp,cv:rec.caves,
    ri:rec.rivers,oc:rec.oceans,cl:rec.cliffs,cp:rec.cap,sl:rec.snowLine,
    su:rec.surface,sb:rec.sub,dp:rec.deep,sh:rec.shore,lq:rec.liquid,se:rec.sea,
    bi:(rec.biomes||[]).map(function(b){
      return [b.name,b.surface,b.sub,b.base,b.amp,
              b.tree.shape,b.tree.trunk,b.tree.leaf,b.tree.density,b.tree.min,b.tree.max];
    }),
    sc:[rec.scatter.block,rec.scatter.count],
    sk:[rec.sky.top,rec.sky.mid,rec.sky.low,rec.sky.sun,rec.sky.el,rec.sky.az],
    fg:[rec.fog.color,rec.fog.near,rec.fog.far],
    ac:rec.ambientColor,al:rec.ambientLevel,dl:rec.daylight,cd:rec.clouds,
    pa:rec.palette,ci:rec.cities,sr:rec.structures,rd:rec.roads};
}
function unpackRecipe(p){
  if(!p||typeof p!=="object") return null;
  return sanitizeRecipe({
    name:p.n,note:p.no,style:p.st,base:p.ba,amp:p.am,caves:p.cv,
    rivers:p.ri,oceans:p.oc,cliffs:p.cl,cap:p.cp,snowLine:p.sl,
    surface:p.su,sub:p.sb,deep:p.dp,shore:p.sh,liquid:p.lq,sea:p.se,
    biomes:(p.bi||[]).map(function(b){
      return {name:b[0],surface:b[1],sub:b[2],base:b[3],amp:b[4],
              tree:{shape:b[5],trunk:b[6],leaf:b[7],density:b[8],min:b[9],max:b[10]}};
    }),
    scatter:{block:(p.sc||[])[0],count:(p.sc||[])[1]},
    sky:{top:(p.sk||[])[0],mid:(p.sk||[])[1],low:(p.sk||[])[2],sun:(p.sk||[])[3],el:(p.sk||[])[4],az:(p.sk||[])[5]},
    fog:{color:(p.fg||[])[0],near:(p.fg||[])[1],far:(p.fg||[])[2]},
    ambientColor:p.ac,ambientLevel:p.al,daylight:p.dl,clouds:p.cd,
    palette:p.pa,cities:p.ci,structures:p.sr,roads:p.rd
  });
}
function worldCode(){
  var sd=(seed>>>0).toString(36).toUpperCase();
  var key=presetKeyOf(W);
  if(key) return key.charAt(0).toUpperCase()+sd;
  var packed=b64enc(JSON.stringify(packRecipe(W)));
  if(!packed) return "H"+sd;
  return "X"+sd+"."+packed;
}
// returns {seed, recipe} or null
function readWorldCode(code){
  var t=String(code||"").trim().replace(/\s+/g,"");
  if(!t) return null;
  var tag=t.charAt(0).toUpperCase(), rest=t.slice(1);
  if(tag==="X"){
    var dot=rest.indexOf(".");
    if(dot<1) return null;
    var sdTok=rest.slice(0,dot);
    if(!/^[0-9A-Za-z]{1,8}$/.test(sdTok)) return null;
    var sd=parseInt(sdTok,36);
    var json=b64dec(rest.slice(dot+1));
    if(!json||isNaN(sd)) return null;
    var obj;
    try{ obj=JSON.parse(json); }catch(e){ return null; }
    var rec=unpackRecipe(obj);
    if(!rec) return null;
    return {seed:sd>>>0,recipe:rec};
  }
  if(!/^[0-9A-Za-z]{1,8}$/.test(rest)) return null;
  var seedPart=parseInt(rest,36);
  if(isNaN(seedPart)) return null;
  var ks=Object.keys(PRESET_WORLDS), i;
  for(i=0;i<ks.length;i++){
    if(ks[i].charAt(0).toUpperCase()===tag)
      return {seed:seedPart>>>0,recipe:sanitizeRecipe(PRESET_WORLDS[ks[i]])};
  }
  if(tag==="H") return {seed:seedPart>>>0,recipe:sanitizeRecipe(defaultRecipe())};
  return null;
}
function applyWorldCode(code){
  var r=readWorldCode(code);
  if(!r) return false;
  W=r.recipe; seed=r.seed;
  edits.clear(); lastBuild=null; selected=0; story=null;
  if(typeof beam!=="undefined") beam.visible=false;
  rebuildWorld("Same code, same world. Whoever else enters it lands here too.");
  return true;
}

// ---- picking real places in the world for a beat to happen
function buildSiteIndex(){
  siteCols=[];
  for(var x=3;x<WX-3;x+=2) for(var z=3;z<WZ-3;z+=2){
    var top=surfaceTop(x,z);
    if(top>1 && top<WY-5) siteCols.push({x:x,z:z,y:top,land:top>W.sea});
  }
}
function findCave(){
  for(var tries=0;tries<400;tries++){
    var x=3+((Math.random()*(WX-6))|0), z=3+((Math.random()*(WZ-6))|0), y=4+((Math.random()*16)|0);
    if(getBlock(x,y,z)===AIR && getBlock(x,y+1,z)===AIR && isSolid(x,y-1,z) && getSky(x,y,z)===0)
      return {x:x,y:y,z:z};
  }
  return null;
}
function findSite(kind,taken){
  if(!siteCols||!siteCols.length) buildSiteIndex();
  var land=siteCols.filter(function(c){ return c.land; });
  if(!land.length) land=siteCols.slice();
  if(!land.length) return {x:(WX/2)|0,y:20,z:(WZ/2)|0};
  function far(c){
    var best=1e9;
    for(var i=0;i<taken.length;i++){
      var dx=c.x-taken[i].x, dz=c.z-taken[i].z;
      best=Math.min(best,Math.sqrt(dx*dx+dz*dz));
    }
    return best;
  }
  function pd(c){ var dx=c.x-pos.x, dz=c.z-pos.z; return Math.sqrt(dx*dx+dz*dz); }
  var pool=land.filter(function(c){ return far(c)>14; });
  if(!pool.length) pool=land;
  var pick1=null, i, best;
  if(kind==="cave"){
    var cv=findCave();
    if(cv) return cv;
    kind="far";
  }
  if(kind==="high"){
    best=-1; for(i=0;i<pool.length;i++) if(pool[i].y>best){ best=pool[i].y; pick1=pool[i]; }
  }else if(kind==="low"){
    best=1e9; for(i=0;i<pool.length;i++) if(pool[i].y<best){ best=pool[i].y; pick1=pool[i]; }
  }else if(kind==="shore"){
    var sh=pool.filter(function(c){ return Math.abs(c.y-W.sea)<=2; });
    pick1=sh.length?sh[(Math.random()*sh.length)|0]:null;
  }else if(kind==="far"){
    best=-1; for(i=0;i<pool.length;i++){ var d=pd(pool[i]); if(d>best){ best=d; pick1=pool[i]; } }
  }else if(kind==="near"){
    var nr=pool.filter(function(c){ var d=pd(c); return d>16 && d<34; });
    pick1=nr.length?nr[(Math.random()*nr.length)|0]:null;
  }
  if(!pick1) pick1=pool[(Math.random()*pool.length)|0];
  return {x:pick1.x,y:pick1.y+1,z:pick1.z};
}

// ---- landmarks the engine builds itself, so a beat always has something to find
function buildLandmark(kind,p){
  if(!kind||kind==="none") return;
  var pal=W.palette, i;
  var rock=COBBLE, post=STONE;
  for(i=0;i<pal.length;i++){ if(pal[i]===COBBLE||pal[i]===BASALT||pal[i]===CLAY){ rock=pal[i]; break; } }
  var cells=[];
  function put(x,y,z,t){
    if(x<0||z<0||y<1||x>=WX||y>=WY||z>=WZ) return;
    if(getBlock(x,y,z)===t) return;
    cells.push([index(x,y,z),t]);
  }
  var x=p.x, y=p.y, z=p.z, dy, dx, dz;
  if(kind==="beacon"){
    for(dy=0;dy<5;dy++) put(x,y+dy,z,rock);
    put(x,y+5,z,LAMP);
    put(x+1,y,z,rock); put(x-1,y,z,rock); put(x,y,z+1,rock); put(x,y,z-1,rock);
  }else if(kind==="cairn"){
    for(dx=-1;dx<=1;dx++) for(dz=-1;dz<=1;dz++) put(x+dx,y,z+dz,rock);
    put(x,y+1,z,rock); put(x+1,y+1,z,rock); put(x,y+2,z,LAMP);
  }else if(kind==="arch"){
    for(dy=0;dy<4;dy++){ put(x-2,y+dy,z,rock); put(x+2,y+dy,z,rock); }
    for(dx=-2;dx<=2;dx++) put(x+dx,y+4,z,rock);
    put(x,y+3,z,LAMP);
  }else if(kind==="shrine"){
    for(dx=-2;dx<=2;dx++) for(dz=-2;dz<=2;dz++) put(x+dx,y-1,z+dz,rock);
    [[-2,-2],[-2,2],[2,-2],[2,2]].forEach(function(c){
      for(dy=0;dy<3;dy++) put(x+c[0],y+dy,z+c[1],post);
      put(x+c[0],y+3,z+c[1],LAMP);
    });
  }else if(kind==="pit"){
    for(dx=-1;dx<=1;dx++) for(dz=-1;dz<=1;dz++) for(dy=0;dy<4;dy++) put(x+dx,y-dy,z+dz,AIR);
    put(x,y-4,z,LAMP);
  }
  if(!cells.length) return;
  var minx=WX,maxx=0,minz=WZ,maxz=0;
  for(i=0;i<cells.length;i++){
    var ix=cells[i][0], cx=ix%WX, cz=((ix/WX)|0)%WZ, cy=(ix/(WX*WZ))|0;
    setBlockRaw(cx,cy,cz,cells[i][1]);
    noteTop(cx,cy,cz,cells[i][1]);
    edits.set(ix,cells[i][1]);
    if(cx<minx)minx=cx; if(cx>maxx)maxx=cx; if(cz<minz)minz=cz; if(cz>maxz)maxz=cz;
  }
  refreshBox(minx,maxx,minz,maxz);
  for(var mx=minx;mx<=maxx;mx++) for(var mz=minz;mz<=maxz;mz++) mapColumn(mx,mz);
}

// ---- generation
function storyPrompt(text){
  var pal=W.palette.map(function(b){ return NAMES[b].toLowerCase(); }).join(", ");
  return [
    "You are the storyteller for a voxel block game. Write a short quest the player can finish by walking, mining and building — nothing else exists in this world. No characters speak; no items beyond blocks.",
    "",
    "The world is called "+W.name+". "+(W.note||""),
    "Its terrain style is "+W.style+". The blocks on hand here: "+pal+".",
    "The player asked for a story about: \""+text+"\"",
    "",
    "Reply with JSON only — no prose, no code fences:",
    '{"title":"The Counting Light","opening":"two or three sentences that set this in motion",',
    ' "ending":"two or three sentences to close it once the last beat is done",',
    ' "beats":[{"name":"The Signal Fire","goal":"Climb to the high ridge","hint":"one sentence of flavor",',
    '   "arrive":"one or two sentences for the moment it is done",',
    '   "site":"high","landmark":"beacon","task":{"kind":"reach"}}]}',
    "",
    "Rules:",
    "- Exactly 3 or 4 beats, in order. Each must be finishable by one of these tasks:",
    '  {"kind":"reach"} — simply get to the place.',
    '  {"kind":"mine","block":"<block>","count":3} — break that many of a block, anywhere. count 2-12.',
    '  {"kind":"place","block":"<block>","count":4} — place that many of a block near the site. count 2-10.',
    "  Use blocks from the list above. Vary the tasks; don't make every beat a reach.",
    "- site picks where the beat happens: high (the highest ground), low (a hollow), shore (the water's edge), cave (underground in the dark), far (across the map), near (a short walk away).",
    "- landmark is what already stands there, built from local rock: beacon, cairn, arch, shrine, pit, or none.",
    "- goal is one short imperative line the player reads while travelling. Keep it under 60 characters.",
    "- Write it as if the world has a history and the player arrived late. Concrete, quiet, specific. No fantasy clichés, no chosen ones, no dragons.",
    "",
    "JSON only."
  ].join("\n");
}
function sanitizeStory(p){
  if(!p||typeof p!=="object"||!Array.isArray(p.beats)||!p.beats.length) return null;
  function str(v,d,n){
    if(typeof v!=="string"||!v.trim()) return d;
    return v.trim().slice(0,n);
  }
  var kinds={reach:1,mine:1,place:1};
  var sites={high:1,low:1,shore:1,cave:1,far:1,near:1};
  var marks={beacon:1,cairn:1,arch:1,shrine:1,pit:1,none:1};
  var s={
    title:str(p.title,"An Account",60),
    opening:str(p.opening,"Something here is unfinished.",400),
    ending:str(p.ending,"That's the end of it.",400),
    beats:[], idx:0, done:false
  };
  p.beats.slice(0,4).forEach(function(b,i){
    if(!b||typeof b!=="object") return;
    var t=b.task||{};
    var kind=kinds[t.kind]?t.kind:"reach";
    var blk=blockId(t.block,-1);
    if((kind==="mine"||kind==="place") && (blk<1||!NAMES[blk])) blk=W.palette[0];
    s.beats.push({
      name:str(b.name,"Beat "+(i+1),48),
      goal:str(b.goal,"Find the place",70),
      hint:str(b.hint,"",160),
      arrive:str(b.arrive,"Done.",300),
      site:sites[b.site]?b.site:"far",
      landmark:marks[b.landmark]?b.landmark:"cairn",
      task:{kind:kind,block:blk,count:(kind==="reach")?1:num(t.count,4,2,12)},
      pos:null, progress:0, done:false
    });
  });
  return s.beats.length?s:null;
}
function beginStory(plan){
  var s=sanitizeStory(plan);
  if(!s) return false;
  story=s;
  buildSiteIndex();
  var taken=[];
  story.beats.forEach(function(b){
    b.pos=findSite(b.site,taken);
    taken.push(b.pos);
  });
  buildLandmark(story.beats[0].landmark,story.beats[0].pos);
  updateQuest();
  saveNow();
  showStoryCard("A STORY BEGINS",story.title,[story.opening,story.beats[0].hint],"BEGIN",null);
  return true;
}

// ---- progress
function activeBeat(){
  if(!story||story.done) return null;
  return story.beats[story.idx]||null;
}
function updateQuest(){
  var b=activeBeat();
  if(!story){ elQuest.hidden=true; beam.visible=false; return; }
  elQuest.hidden=false;
  elQuest.classList.toggle("done",!!story.done);
  elQTitle.textContent=story.title.toUpperCase();
  if(!b){
    elQName.textContent="Finished";
    elQGoal.textContent=story.ending.split(". ")[0]||"";
    elQDist.textContent=""; elQProg.textContent=""; elQArrow.style.display="none";
    beam.visible=false;
    return;
  }
  elQArrow.style.display="";
  elQName.textContent=b.name;
  elQGoal.textContent=b.goal;
  if(b.pos){ beam.visible=true; beam.position.set(b.pos.x+0.5,b.pos.y+38,b.pos.z+0.5); }
  else beam.visible=false;
  elQProg.textContent=(b.task.kind==="reach")?"":(" · "+b.progress+"/"+b.task.count+" "+NAMES[b.task.block].toLowerCase());
}
function questTick(){
  var b=activeBeat();
  if(!b||!b.pos) return;
  var dx=b.pos.x+0.5-pos.x, dy=b.pos.y-pos.y, dz=b.pos.z+0.5-pos.z;
  var flat=Math.sqrt(dx*dx+dz*dz);
  elQDist.textContent=Math.round(Math.sqrt(flat*flat+dy*dy))+"m";
  var bearing=Math.atan2(dx,-dz)+yaw;
  elQArrow.style.transform="rotate("+(bearing*180/Math.PI)+"deg)";
  if(b.task.kind==="reach" && flat<4.5 && Math.abs(dy)<7) completeBeat();
}
function completeBeat(){
  var b=activeBeat();
  if(!b) return;
  b.done=true;
  var last=(story.idx>=story.beats.length-1);
  var paras=[b.arrive];
  if(last){
    story.done=true;
    paras.push(story.ending);
  }else{
    story.idx++;
    var nx=story.beats[story.idx];
    buildLandmark(nx.landmark,nx.pos);
    if(nx.hint) paras.push(nx.hint);
  }
  updateQuest();
  saveNow();
  sfxChime(!last);
  showStoryCard(last?"THE END":"CHAPTER "+(story.idx+1),
    last?story.title:story.beats[story.idx].name, paras, last?"CLOSE":"ONWARD", null);
}
function onMined(type,x,y,z){
  var b=activeBeat();
  if(!b||b.task.kind!=="mine"||type!==b.task.block) return;
  b.progress++;
  updateQuest();
  if(b.progress>=b.task.count) completeBeat();
  else saveSoon();
}
function onPlaced(type,x,y,z){
  var b=activeBeat();
  if(!b||b.task.kind!=="place"||type!==b.task.block||!b.pos) return;
  var dx=x-b.pos.x, dz=z-b.pos.z;
  if(Math.sqrt(dx*dx+dz*dz)>10){
    toast("Build it closer to "+b.name+".");
    return;
  }
  b.progress++;
  updateQuest();
  if(b.progress>=b.task.count) completeBeat();
  else saveSoon();
}

var stickId=null, lookId=null, lookStickId=null;
var stickOrigin={x:0,y:0,r:60}, lookOrigin={x:0,y:0,r:60};
var stickVec={x:0,y:0}, lookVec={x:0,y:0}, lookLast={x:0,y:0};
var LOOK_RATE=2.35;   // radians per second at full deflection
var elStick=document.getElementById("stick"), elKnob=document.getElementById("knob");
var elLook=document.getElementById("lookStick"), elLookKnob=document.getElementById("lookKnob");

function ringOf(el){
  var r=el.getBoundingClientRect();
  return {x:r.left+r.width/2, y:r.top+r.height/2, r:r.width/2};
}
function stickPos(){ return ringOf(elStick); }
function nearRing(el,x,y,slack){
  var r=ringOf(el);
  var dx=x-r.x, dy=y-r.y;
  return Math.sqrt(dx*dx+dy*dy)<=r.r*(slack||1.35);
}
canvas.addEventListener("pointerdown",function(e){
  if(paused||asking||reading||invOpen||e.pointerType!=="touch") return;
  if(nearRing(elLook,e.clientX,e.clientY)){
    if(lookStickId!==null) return;
    lookStickId=e.pointerId; lookOrigin=ringOf(elLook); updateLookStick(e.clientX,e.clientY);
    return;
  }
  if(nearRing(elStick,e.clientX,e.clientY)){
    if(stickId!==null) return;
    stickId=e.pointerId; stickOrigin=ringOf(elStick); updateStick(e.clientX,e.clientY);
    return;
  }
  // anywhere else still works as a swipe, for anyone who prefers it
  if(lookId!==null) return;
  lookId=e.pointerId; lookLast={x:e.clientX,y:e.clientY};
});
canvas.addEventListener("pointermove",function(e){
  if(paused||asking||reading||invOpen) return;
  if(e.pointerId===lookStickId) updateLookStick(e.clientX,e.clientY);
  else if(e.pointerId===stickId) updateStick(e.clientX,e.clientY);
  else if(e.pointerId===lookId){
    yaw-=(e.clientX-lookLast.x)*0.0052;
    pitch=clamp(pitch-(e.clientY-lookLast.y)*0.0052,-1.55,1.55);
    lookLast={x:e.clientX,y:e.clientY};
  }
});
function endPointer(e){
  if(e.pointerId===stickId){ stickId=null; stickVec={x:0,y:0}; elKnob.style.transform=""; }
  if(e.pointerId===lookStickId){ lookStickId=null; lookVec={x:0,y:0}; elLookKnob.style.transform=""; }
  if(e.pointerId===lookId) lookId=null;
}

function updateStick(cx,cy){
  var o=stickOrigin, dx=cx-o.x, dy=cy-o.y, m=Math.sqrt(dx*dx+dy*dy), lim=o.r*0.72;
  if(m>lim){ dx*=lim/m; dy*=lim/m; }
  stickVec={x:dx/lim, y:dy/lim};
  elKnob.style.transform="translate("+dx+"px,"+dy+"px)";
}
function updateLookStick(cx,cy){
  var o=lookOrigin, dx=cx-o.x, dy=cy-o.y, m=Math.sqrt(dx*dx+dy*dy), lim=o.r*0.72;
  if(m>lim){ dx*=lim/m; dy*=lim/m; }
  // a small dead zone, so resting a thumb does not drift the camera
  var vx=dx/lim, vy=dy/lim;
  if(Math.abs(vx)<0.12) vx=0;
  if(Math.abs(vy)<0.12) vy=0;
  lookVec={x:vx, y:vy};
  elLookKnob.style.transform="translate("+dx+"px,"+dy+"px)";
}

var last=performance.now(), fps=60, fpsAcc=0, fpsN=0, readTick=0, liqT=0, liqPhase=0, netMenuT=0;
function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min((now-last)/1000,0.05); last=now;
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>0.5){ fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0; }
  if(!paused && !asking && !reading && !invOpen) step(dt);
  liqT+=dt;
  if(liqT>0.12){ liqT=0; liqPhase+=0.42; paintWater(liqPhase); paintLava(liqPhase*1.3); atlasTex.needsUpdate=true; }
  SUN.uTime.value=now*0.001;
  SUN.uCam.value.copy(camera.position);
  updateTime(paused?dt*0.25:dt);
  var fc = inLiquid ? ((inLiquid===LAVA)?[0.54,0.16,0.03]:[0.16,0.43,0.62]) : skyNowFog;
  fc=acesJS(fc,renderer.toneMappingExposure);
  scene.fog.color.setRGB(fc[0],fc[1],fc[2]);
  renderer.setClearColor(scene.fog.color,1);
  if(!paused && !asking && !reading && !invOpen){
    stepParticles(dt);
    if(crittersOn) stepCritters(dt,now);
    stepDrops(dt,now);
    stepCars(dt,now);
    netTimer+=dt;
    if(netTimer>0.1){ netTimer=0; netSendPresence(); netReadPeers(); netFlush(); }
    physTick();
    chunkVisTimer+=dt;
    if(chunkVisTimer>0.45){ chunkVisTimer=0; updateChunkVis(); }
    mapTimer+=dt;
    if(mapOn && mapTimer>0.1){ mapTimer=0; drawMap(); }
  }
  if(paused&&!elMenu.hidden){
    netMenuT=(netMenuT||0)+dt;
    if(netMenuT>1){ netMenuT=0; netSendPresence(); netReadPeers(); renderNetBox(); }
  }
  if(cloudTex){ cloudTex.offset.x=(now*0.0000055)%1; cloudTex.offset.y=(now*0.0000021)%1; }
  engineAudio();
  sky.position.copy(camera.position);
  if(bloomOn && composer) composer.render(); else renderer.render(scene,camera);
}
function step(dt){
  physicsStep(dt);
  mineStep(dt);

  var h=driving?null:pick(6);
  if(h&&!crackMesh.visible){ hiBox.visible=true; hiBox.position.set(h.x+0.5,h.y+0.5,h.z+0.5); }
  else hiBox.visible=false;

  questTick();

  if(driving&&driving.slip>0.25&&driving.grounded>=2){
    squealT-=dt;
    if(squealT<=0){ squealT=0.14; noiseHit(2300,5.5,0.18,0.030+Math.min(driving.slip,2)*0.016); }
  }
  if(!!inLiquid!==!!wasInLiquid){ sfxSplash(); wasInLiquid=inLiquid; }
  elWet.classList.toggle("on",!!inLiquid);
  elWet.classList.toggle("hot",inLiquid===LAVA);
  if(inLiquid){
    scene.fog.near=0.2; scene.fog.far=(inLiquid===LAVA)?8:22;
  }else{
    scene.fog.near=W.fog.near; scene.fog.far=W.fog.far;
  }
  if(muffle) muffle.frequency.value=inLiquid?380:20000;
  if(windGain){
    var openness=getSky(Math.floor(pos.x),Math.floor(pos.y+EYE_H),Math.floor(pos.z))/15;
    windGain.gain.value=(audioOn&&!inLiquid)?(0.012+openness*0.055):0;
  }
  if(rumbleGain) rumbleGain.gain.value=(audioOn&&W.liquid===LAVA)?0.05:0;
  sky.visible=!inLiquid;

  if(elVitals) elVitals.hidden=false;
  if(vHp) vHp.style.width=clamp(hp/maxHp*100,0,100)+"%";
  if(vBreathRow) vBreathRow.hidden=(breath>=maxBreath-0.5);
  if(vAir) vAir.style.width=clamp(breath/maxBreath*100,0,100)+"%";

  readTick+=dt;
  if(readTick>0.2){
    readTick=0;
    var hb=h?NAMES[getBlock(h.x,h.y,h.z)]:"—";
    var spd=driving?Math.sqrt(driving.vx*driving.vx+driving.vz*driving.vz):Math.sqrt(vel.x*vel.x+vel.z*vel.z);
    elRead.innerHTML=
      '<span class="wname">'+W.name.toUpperCase()+"</span>"+
      "X <b>"+(driving?driving.x:pos.x).toFixed(1)+"</b> Y <b>"+(driving?driving.y:pos.y).toFixed(1)+"</b> Z <b>"+(driving?driving.z:pos.z).toFixed(1)+"</b><br>"+
      (driving?("DRIVING<br>"):"HOLDING <b>")+(driving?"":((heldBlock()?NAMES[heldBlock()]+(creative?"":" x"+(inv[selected]?inv[selected].count:0)):"-")+"</b><br>"))+
      (driving?"":("TARGET <b>"+hb+"</b><br>"))+
      (peerCount?("WITH <b>"+peerCount+"</b> OTHER"+(peerCount>1?"S":"")+"<br>"):"")+
      (driving?(Math.round(spd*3.6)+" KM/H"):(spd.toFixed(1)+" M/S"))+" · "+clockText()+" · "+Math.round(fps)+" FPS";
  }
}
