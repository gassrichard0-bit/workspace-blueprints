# Publishes the Blockfall game to GitHub Pages.
# `enablement: true` turns Pages on by itself the first time this runs, so nobody
# has to go into Settings. Only the blockfall folder is served; the rest of the
# repo stays off the web.
name: Deploy Blockfall to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages (enables it if it is off)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the site
        run: |
          mkdir -p _site/blockfall
          cp blockfall/index.html _site/blockfall/index.html
          # a bare visit to the repo path should land on the game, not a 404
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Blockfall</title>
          <meta http-equiv="refresh" content="0; url=blockfall/">
          <link rel="canonical" href="blockfall/">
          <style>
            html,body{margin:0;height:100%;background:#0c1016;color:#e8eef6;
              font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
              display:grid;place-items:center;text-align:center}
            a{color:#8fd0ff}
          </style>
          </head>
          <body><p>Loading Blockfall… <a href="blockfall/">tap here</a> if nothing happens.</p></body>
          </html>
          HTML
          ls -lR _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
